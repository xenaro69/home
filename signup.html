<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Xenaro</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Arial,sans-serif;
}

.box{
    width:380px;
    max-width:90%;
    background:#222;
    padding:30px;
    border-radius:20px;
    color:white;
}

h1{
    text-align:center;
}

input,button{
    width:100%;
    height:52px;
    margin-top:14px;
    border-radius:26px;
    box-sizing:border-box;
    font-size:16px;
}

input{
    padding:0 18px;
    background:#050505;
    color:white;
    border:1px solid #444;
}

button{
    border:none;
    background:#fff;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

p{
    text-align:center;
    color:#aaa;
}

a{
    color:white;
}
</style>
</head>

<body>

<div class="box">

<h1>Create account</h1>

<input type="email" id="email" placeholder="Email address">

<input type="password" id="password" placeholder="Password">

<button onclick="signup()">Sign up</button>

<p>
Already have an account?
<a href="login.html">Log in</a>
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://bvmcuoiprayzeksljnyo.supabase.co";
const SUPABASE_KEY = "sb_publishable_RlXQ4_mUAhiKxuTsxGLU-Q_ILaQT_8C";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function signup(){

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const { data, error } =
        await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

    if(error){
        alert(error.message);
        return;
    }

    alert("Account created. Check your email if Supabase asks for verification.");

    window.location.href = "login.html";
}

</script>

</body>
</html>

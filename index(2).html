<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

#particles {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

.back-btn{
    position:fixed;
    top:11px;
    right:24px;
    z-index:600;
    background:#ffffff;
    border:1px solid rgba(255,255,255,.15);
    color:#000000;
    height:42px;
    padding:0 18px;
    border-radius:40px;
    cursor:pointer;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:600;
}

.back-btn:hover{
    background:#e6e6e6;
    transform:translateX(3px);
}

:root{
    --accent:#ffffff;
}

html, body{
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    position:relative;
}

/* scattered dot backdrop - removed */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(18px);
    background:rgba(0,0,0,.5);
    border-bottom:1px solid rgba(255,255,255,.12);
    display:flex;
    align-items:center;
}

nav{
    width:100%;
    max-width:1680px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:
        0 0 8px rgba(0,207,255,.8),
        0 0 16px rgba(0,207,255,.6),
        0 0 30px rgba(0,207,255,.3);
    animation:cyanGlow 2.5s ease-in-out infinite;
}

@keyframes cyanGlow{
    0%,100%{
        text-shadow:
            0 0 8px rgba(0,207,255,.8),
            0 0 16px rgba(0,207,255,.6),
            0 0 30px rgba(0,207,255,.3);
    }
    50%{
        text-shadow:
            0 0 12px rgba(0,207,255,1),
            0 0 25px rgba(0,207,255,.8),
            0 0 45px rgba(0,207,255,.5);
    }
}

/* ============ PROFILE PAGE (single page, no scroll) ============ */
#profilePage{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(90px,10vw,120px) clamp(24px,6vw,64px) clamp(40px,6vw,60px);
}

.profile-wrap{
    width:100%;
    max-width:1200px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(30px,5vw,60px);
    flex-wrap:wrap;
}

.profile-intro{
    flex:1;
    min-width:280px;
}

.profile-intro h1{
    font-size:clamp(48px,7vw,74px);
    font-weight:800;
    line-height:1.1;
    letter-spacing:-.5px;
    text-transform:uppercase;
    margin-bottom:24px;
}

.profile-intro h1 span{
    color:#ffffff;
}

.profile-intro p{
    font-size:clamp(14px,1.4vw,17px);
    line-height:1.8;
    color:#bbb;
    max-width:440px;
}

.profile-card{
    position:fixed;
    width:640px;
    min-width:640px;
    height:auto;
    top:50%;
    right:clamp(24px,4vw,64px);
    transform:translateY(-50%);
    background:#000000;
    border:1px solid rgba(255,255,255,.2);
    border-radius:28px;
    padding:22px 48px;
    backdrop-filter:blur(30px);
    box-shadow:0 0 30px rgba(255,255,255,.1), 0 8px 32px rgba(0,0,0,.5);
    overflow:hidden;
    transition:.4s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
    white-space:nowrap;
    max-width:90vw;
}

.profile-card:hover{
    border-color:rgba(255,255,255,.4);
    background:rgba(255,255,255,.09);
    box-shadow:0 0 50px rgba(255,255,255,.2), 0 8px 40px rgba(0,0,0,.6);
    transform:translateY(calc(-50% - 8px));
}

.profile-card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:28px;
    padding:1px;
    background:linear-gradient(135deg, rgba(255,255,255,.3), transparent);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:.4s;
    pointer-events:none;
}

.profile-card:hover::after{
    opacity:1;
}

.profile-top{
    position:relative;
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:16px;
}

.profile-photo-wrap{
    position:relative;
    flex:none;
    width:110px;
    height:110px;
}

.profile-photo-ring{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.2);
}

.profile-photo, .profile-photo-fallback{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid rgba(255,255,255,.5);
}

.profile-photo-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#1a1a1a,#050505);
    color:#ffffff;
    font-size:32px;
    font-weight:800;
}

.profile-names h2{
    font-size:24px;
    font-weight:800;
    letter-spacing:.5px;
    margin-bottom:6px;
}

.profile-tag{
    font-size:12px;
    color:#888;
    letter-spacing:1px;
    text-transform:uppercase;
}

.profile-divider{
    height:1px;
    width:100%;
    background:rgba(255,255,255,.12);
    margin-bottom:26px;
    display:none;
}

.profile-list{
    position:relative;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.profile-list li{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:15px;
    font-weight:500;
    color:#d5d5d5;
    transition:.3s;
    white-space:nowrap;
}

.profile-list li:hover{
    color:#ffffff;
    transform:translateX(6px);
}

.profile-list li i{
    font-size:16px;
    color:rgba(255,255,255,.6);
    width:18px;
    text-align:center;
    transition:.3s;
}

.profile-list li:hover i{
    color:var(--accent);
}

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#0a0a0a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    opacity:1;
    transition:opacity .6s ease-out;
}

#loadingScreen.fade-out{
    opacity:0;
    pointer-events:none;
}

.loader{
    width:60px;
    height:60px;
    position:relative;
}

.loader::before{
    content:"";
    position:absolute;
    inset:0;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:#ffffff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.loader-text{
    font-size:14px;
    color:#ffffff;
    font-weight:500;
    letter-spacing:1px;
    text-transform:uppercase;
    animation:pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
    0%, 100%{ opacity:.6; }
    50%{ opacity:1; }
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    z-index:2;
    padding:16px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.12);
    color:#999;
    font-size:11px;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(10px);
}

footer h2{
    font-size:13px;
    margin-bottom:2px;
    color:#ffffff;
    font-weight:700;
}

.social-links{
    display:none;
    gap:14px;
    margin-top:26px;
    opacity:0;
    transform:translateY(10px);
    transition:.4s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
}

.profile-card.active .social-links{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.social-link{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    transition:.3s;
    cursor:pointer;
    flex-shrink:0;
}

.social-link:hover{
    border-color:#00cfff;
    color:#00cfff;
    background:rgba(0,207,255,.1);
}

@media(max-width:900px){
    header{ height:56px; }
    .logo{ font-size:19px; }

    #profilePage{
        padding:76px 20px 70px;
    }
    .profile-wrap{
        flex-direction:column;
        text-align:center;
    }
    .profile-intro{
        text-align:center;
    }
    .profile-intro h1{
        font-size:clamp(36px,5vw,52px);
    }
    .profile-intro p{
        margin:0 auto;
    }
    .profile-top{
        justify-content:center;
    }
    .profile-card{
        position:relative;
        top:auto;
        right:auto;
        transform:none;
        width:100%;
        min-width:0;
        white-space:normal;
    }
    .profile-card:hover{
        transform:translateY(-8px);
    }
}
</style>
</head>
<body>

<div id="loadingScreen">
    <div class="loader"></div>
    <div class="loader-text">LOADING</div>
</div>

<canvas id="particles"></canvas>

<button class="back-btn" onclick="history.back()">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back</span>
</button>

<header>
    <nav>
        <span class="logo">XENARO</span>
    </nav>
</header>

<!-- ============ PROFILE ============ -->
<div id="profilePage">
    <div class="profile-wrap">
        <div class="profile-intro">
            <h1>I AM <span>XENARO</span></h1>
            <p>Editing gameplay into montages, breaking down the meta, and building a community around the games I love — one video at a time.</p>
        </div>

        <div class="profile-card">
            <div class="profile-top">
                <div class="profile-photo-wrap">
                    <div class="profile-photo-ring"></div>
                    <img src="favicon.png" alt="Xenaro" class="profile-photo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'profile-photo-fallback',textContent:'X'}))">
                </div>
                <div class="profile-names">
                    <h2>Xenaro</h2>
                    <div class="profile-tag">Creator</div>
                </div>
            </div>
            <div class="profile-divider"></div>
            <ul class="profile-list">
                <li><i class="fa-solid fa-graduation-cap"></i>Coding</li>
                <li><i class="fa-solid fa-gamepad"></i>Gaming</li>
                <li><i class="fa-solid fa-film"></i>Video Editing</li>
            </ul>
            <div class="social-links">
                <a href="#" class="social-link" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" class="social-link" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-link" title="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="social-link" title="Discord"><i class="fa-brands fa-discord"></i></a>
            </div>
        </div>
    </div>
</div>

<footer id="siteFooter">
    <h2>XENARO</h2>
    <p>© 2026 All Rights Reserved.</p>
</footer>

<script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    function resize(){
        canvas.width = innerWidth;
        canvas.height = innerHeight;
    }
    resize();
    addEventListener("resize", resize);

    const particles = Array.from({length:70},()=>({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        s:Math.random()*1.2+0.3,
        a:Math.random()*0.7+0.2
    }));

    function animate(){
        ctx.clearRect(0,0,canvas.width,canvas.height);

        particles.forEach(p=>{
            ctx.beginPath();
            ctx.fillStyle=`rgba(255,255,255,${p.a})`;
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fill();

            p.y-=p.s;

            if(p.y<-5){
                p.y=canvas.height+5;
                p.x=Math.random()*canvas.width;
            }
        });

        requestAnimationFrame(animate);
    }
    animate();

    // Fade out loading screen
    window.addEventListener('load', ()=>{
        setTimeout(()=>{
            const loadingScreen = document.getElementById('loadingScreen');
            if(loadingScreen){
                loadingScreen.classList.add('fade-out');
                setTimeout(()=>loadingScreen.remove(), 600);
            }
        }, 800);
    });

    // Profile card interactivity
    const profileCard = document.querySelector('.profile-card');
    profileCard.addEventListener('click', ()=>{
        profileCard.classList.toggle('active');
    });

    // Close on outside click
    document.addEventListener('click', (e)=>{
        if(!profileCard.contains(e.target) && profileCard.classList.contains('active')){
            profileCard.classList.remove('active');
        }
    });
</script>
</body>
</html>

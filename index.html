<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
@font-face{
    font-family:'Sunrise Brown';
    src:url('Sunrise Brown.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100%;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    background:#000;
    color:#f5f5f5;
    overflow-x:hidden;
    overflow-y:auto;
}

::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:#000; }
::-webkit-scrollbar-thumb{
    background:#fff;
    border-radius:100px;
}

/* Background particles (white dots drifting upwards) */
#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

/* Loading screen: cyan XENARO */
#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    visibility:visible;
    transition:opacity .45s ease, visibility .45s ease;
}

#loadingScreen.fade-out{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-logo{
    font-size:clamp(36px,8vw,64px);
    font-weight:800;
    letter-spacing:4px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
    animation:logoPulse 1.4s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{ text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6); }
    50%{ text-shadow:0 0 20px #00cfff,0 0 50px rgba(0,207,255,.8); }
}

/* Header */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(8px);
    background:rgba(0,0,0,.6);
    border-bottom:1px solid rgba(255,255,255,.22);
}

nav{
    max-width:1680px;
    height:100%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
    position:relative;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
    animation:logoPulse 2s ease-in-out infinite;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.nav-buttons{
    display:flex;
    gap:12px;
    align-items:center;
}

.about-btn,
.join-btn{
    padding:10px 22px;
    background:#fff;
    border-radius:40px;
    color:#000;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    transition:.35s;
}

.about-btn:hover,
.join-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

/* Page */
.page{
    position:relative;
    z-index:2;
    padding-top:64px;
}

/* Hero */
.hero-section{
    width:100%;
    max-width:1320px;
    min-height:auto;
    margin:0 auto;
    padding:42px clamp(24px,4vw,64px) 52px;
    display:grid;
    grid-template-columns:1fr;
    gap:30px;
    align-items:center;
}

.hero-left{
    text-align:center;
}

.hero-left h2{
    font-size:clamp(26px,3.4vw,48px);
    line-height:1.02;
    font-weight:800;
    margin-bottom:16px;
}

.hero-left p{
    font-size:clamp(13px,1.2vw,17px);
    opacity:.7;
}

.hero-right{
    width:min(100%,1200px);
    margin:0 auto;
    perspective:1200px;
    position:relative;
    z-index:10;
}

/* Profile card: near-black with white outline */
.glass-card{
    width:100%;
    background:#0d0d0d;
    border:1px solid #fff;
    border-radius:22px;
    padding:clamp(34px,4.4vw,56px);
    box-shadow:0 0 30px rgba(255,255,255,.12);
    transition:box-shadow .3s ease,transform .22s ease-out;
    transform-style:preserve-3d;
    will-change:transform;
}

.glass-card:hover{
    box-shadow:0 0 45px rgba(255,255,255,.25);
}

.card-layer{ transform-style:preserve-3d; }

.glass-card h2{
    font-size:clamp(26px,3.2vw,42px);
    margin-bottom:5px;
    transform:translateZ(45px);
}

.glass-card > .card-layer > p{
    font-size:20px;
    opacity:.65;
    transform:translateZ(35px);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:22px;
    margin-top:24px;
    transform:translateZ(30px);
}

.stats h3{
    font-size:clamp(24px,2.6vw,34px);
    color:#fff;
}

.stats span{
    display:block;
    margin-top:4px;
    opacity:.6;
    font-size:18px;
    line-height:1.4;
}

/* Scrolling content area */
.content-flow{
    width:min(960px,calc(100% - 80px));
    margin:0 auto;
    padding:20px 0 90px;
}

/* Social links: near-black with white outline */
.social-section{
    padding-top:12px;
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    justify-content:center;
    align-items:center;
}

.social-link{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 34px;
    border-radius:50px;
    background:#0d0d0d;
    border:1px solid #fff;
    color:#f5f5f5;
    font-size:30px;
    text-decoration:none;
    transition:.35s;
}

.social-link span{
    font-size:24px;
    font-weight:500;
}

.social-link::after{
    content:attr(data-label);
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:#fff;
    padding:6px 12px;
    border:1px solid #fff;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    margin-bottom:8px;
}

.social-link:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px rgba(255,255,255,.35);
}

.social-link:hover::after{ opacity:1; }

footer{
    position:relative;
    z-index:2;
    padding:24px 20px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.12);
    color:#999;
    font-size:14px;
    background:#000;
}

footer h2{
    font-size:18px;
    margin-bottom:4px;
    color:#f5f5f5;
}

@media(max-width:900px){
    header{ height:56px; }
    nav{ padding:0 18px; }
    .logo{ font-size:19px; }
    .nav-buttons{ gap:8px; }
    .about-btn,.join-btn{ padding:8px 14px; font-size:13px; }

    .page{ padding-top:56px; }

    .hero-section{
        min-height:auto;
        grid-template-columns:1fr;
        gap:26px;
        padding:52px 20px 56px;
        text-align:center;
    }

    .hero-left h2{
        font-size:clamp(27px,8vw,38px);
        margin-bottom:14px;
    }

    .hero-right{
        width:100%;
        max-width:520px;
        margin:0 auto;
    }

    .glass-card{
        padding:26px 22px;
        transform:none !important;
    }

    .glass-card h2,
    .glass-card > .card-layer > p,
    .stats{
        transform:none;
    }

    .content-flow{
        width:min(100% - 32px,700px);
        padding:10px 0 64px;
    }

    .social-links{ gap:10px; }
    .social-link{
        flex:0 1 calc(50% - 5px);
        max-width:220px;
        justify-content:center;
        padding:11px 14px;
        font-size:18px;
    }
    .social-link span{ font-size:16px; }
}

@media(max-width:520px){
    .stats{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:18px 10px;
        padding-top:20px;
        border-top:1px solid rgba(255,255,255,.1);
    }

    .stats h3{ font-size:clamp(18px,2vw,26px); }
    .stats span{ font-size:13px; }
}

@media(max-width:900px){
    .hero-left h2{font-size:clamp(27px,8vw,38px);}
    .hero-left p{font-size:16px;}
    .glass-card h2{font-size:21px;}
    .stats h3{font-size:18px;}
}

/* White click/touch circle fade effect */
.click-circle{
    position:fixed;
    width:18px;
    height:18px;
    left:0;
    top:0;
    border:2px solid #fff;
    border-radius:50%;
    pointer-events:none;
    z-index:99998;
    transform:translate(-50%,-50%) scale(.2);
    opacity:.95;
    box-shadow:0 0 8px rgba(255,255,255,.65);
    animation:clickCircleFade .6s ease-out forwards;
}
@keyframes clickCircleFade{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:.95;}
    100%{transform:translate(-50%,-50%) scale(3.2);opacity:0;}
}

</style>
</head>

<body>
<div id="loadingScreen"><div class="loader-logo">XENARO</div></div>

<div id="particles"></div>

<header>
    <nav>
        <div class="nav-buttons">
            <a class="about-btn" href="about/"><i class="fa-solid fa-user"></i> About me</a>
        </div>
        <div class="logo">XENARO</div>
        <div class="nav-buttons">
            <a class="join-btn" href="https://discord.gg/C64h96EGR7" target="_blank" rel="noopener">Join Now</a>
        </div>
    </nav>
</header>

<main class="page">
    <section class="hero-section" id="home">
        <div class="hero-left">
            <h2>Wsp Homies!!!</h2>
            <p>Subscribe Kar Diye Ho Nahh??</p>
        </div>

        <div class="hero-right">
            <div class="glass-card" id="mainCard">
                <div class="card-layer">
                    <h2>XENARO.69</h2>
                    <p>Gaming Creator</p>
                    <div class="stats">
                        <div>
                            <h3>1000+</h3>
                            <span>YouTube Subscribers</span>
                        </div>
                        <div>
                            <h3>60+</h3>
                            <span>Instagram Followers</span>
                        </div>
                        <div>
                            <h3>30+</h3>
                            <span>Discord Members</span>
                        </div>
                        <div>
                            <h3>0+</h3>
                            <span>Twitter Followers</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="content-flow">
        <section class="social-section" id="socials">
            <div class="social-links">
                <a href="https://www.youtube.com/@xenaro.69" target="_blank" rel="noopener" class="social-link" data-label="YOUTUBE CHANNEL">
                    <i class="fa-brands fa-youtube"></i><span>YouTube</span>
                </a>
                <a href="https://www.instagram.com/xenaro.69/" target="_blank" rel="noopener" class="social-link" data-label="INSTAGRAM ACCOUNT">
                    <i class="fa-brands fa-instagram"></i><span>Instagram</span>

                <a href="https://discord.gg/C64h96EGR7" target="_blank" rel="noopener" class="social-link" data-label="DISCORD SERVER">
                    <i class="fa-brands fa-discord"></i><span>Discord</span>
                </a>
                <a href="https://x.com/xenaro_69" target="_blank" rel="noopener" class="social-link" data-label="TWITTER PROFILE">
                    <i class="fa-brands fa-twitter"></i><span>Twitter</span>
                </a>
            </div>
        </section>
    </div>
</main>

<footer>
    <h2>XENARO</h2>
    <p>© 2026 All Rights Reserved.</p>
</footer>

<script>
/* Create a fading white circle wherever the user clicks or touches */
function createClickCircle(x,y){
    const circle=document.createElement("span");
    circle.className="click-circle";
    circle.style.left=x+"px";
    circle.style.top=y+"px";
    document.body.appendChild(circle);
    circle.addEventListener("animationend",()=>circle.remove());
}
document.addEventListener("pointerdown",(e)=>{
    createClickCircle(e.clientX,e.clientY);
});

/* Fade out the cyan XENARO loading screen once the page has loaded */
window.addEventListener("load", () => {
    setTimeout(() => {
        const loadingScreen = document.getElementById("loadingScreen");
        if(loadingScreen){
            loadingScreen.classList.add("fade-out");
            setTimeout(() => loadingScreen.remove(), 1000);
        }
    }, 900);
});

/* White dots drifting upwards in the background */
const particleContainer = document.getElementById("particles");
function createParticle(){
    const p = document.createElement("span");
    const size = Math.random() * 6 + 2;
    p.style.position = "absolute";
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.borderRadius = "50%";
    p.style.background = "#ffffff";
    p.style.opacity = Math.random() * 0.6;
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "110vh";
    p.style.boxShadow = "0 0 20px rgba(255,255,255,.6)";
    particleContainer.appendChild(p);

    const speed = Math.random() * 5 + 6;
    let y = 110;
    const move = setInterval(() => {
        y -= 0.2;
        p.style.top = y + "vh";
        if(y < -10){
            clearInterval(move);
            p.remove();
        }
    }, speed);
}
setInterval(createParticle,120);

const header = document.querySelector("header");
window.addEventListener("scroll", () => {
    header.style.background = window.scrollY > 50 ? "rgba(0,0,0,.85)" : "rgba(0,0,0,.6)";
});

document.querySelectorAll(".glass-card").forEach(card => {
    card.addEventListener("mousemove", e => {
        if(window.innerWidth <= 900) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rx = ((y / rect.height) - 0.5) * 10;
        const ry = (0.5 - (x / rect.width)) * 10;
        card.style.transform = `perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.003,1.003,1.003)`;
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)";
    });
});
</script>
</body>
</html>

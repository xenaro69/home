<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

@font-face{
    font-family:'Sunrise Brown';
    src:url('Sunrise Brown.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    width:100%;
    height:100vh;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#0f0f0f;
}

::-webkit-scrollbar-thumb{
    background:#fff;
    border-radius:100px;
}


/* =========================
   PARTICLES
========================= */

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}


/* =========================
   LOADER
========================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity 1s ease-out;
}

#loadingScreen.fade-out{
    opacity:0;
    pointer-events:none;
}

.loader-logo{
    font-size:clamp(32px,5vw,48px);
    font-weight:800;
    letter-spacing:10px;
    color:#00cfff;
    animation:pulse 1.2s infinite;
    text-shadow:0 0 12px #00cfff;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.1);
        text-shadow:
        0 0 20px #00cfff,
        0 0 50px #00cfff;
    }

    100%{
        transform:scale(1);
    }

}


/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;

    backdrop-filter:blur(8px);

    background:rgba(10,10,10,.18);

    border-bottom:
    1px solid rgba(255,255,255,.22);
}

nav{
    max-width:1680px;
    height:100%;

    margin:auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 clamp(24px,4vw,64px);

    width:100%;

    position:relative;
}


/* LOGO */

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;

    color:#00cfff;

    text-shadow:
    0 0 12px #00cfff,
    0 0 30px rgba(0,207,255,.6);

    animation:logoPulse 2s ease-in-out infinite;
}

@keyframes logoPulse{

    0%,100%{
        text-shadow:
        0 0 12px #00cfff,
        0 0 30px rgba(0,207,255,.6);
    }

    50%{
        text-shadow:
        0 0 20px #00cfff,
        0 0 50px rgba(0,207,255,.8);
    }

}


/* LOGIN BUTTON IN CENTER */

.login-btn{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:10px 24px;

    background:#fff;

    border:none;

    border-radius:40px;

    color:#000;

    font-family:'Sunrise Brown','Poppins',sans-serif;

    font-weight:700;

    font-size:15px;

    cursor:pointer;

    transition:.35s;
}

.login-btn:hover{

    transform:
    translate(-50%,-53%);

    box-shadow:
    0 0 30px
    rgba(255,255,255,.5);
}


.nav-buttons{
    display:flex;
    gap:12px;
    align-items:center;
}


.about-btn{

    padding:10px 22px;

    background:#fff;

    border-radius:40px;

    color:#000;

    font-weight:700;

    font-size:15px;

    text-decoration:none;

    transition:.35s;
}

.about-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 30px
    rgba(255,255,255,.5);
}


/* =========================
   PAGE
========================= */

.page{

    position:relative;

    z-index:2;

    flex:1;

    padding-top:64px;

    padding-bottom:80px;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================
   WELCOME
========================= */

.welcome-container{

    text-align:center;

    animation:
    fadeInUp
    1s ease-out;
}

@keyframes fadeInUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.welcome-container h1{

    font-size:
    clamp(42px,6vw,72px);

    font-weight:800;

    margin-bottom:24px;

    color:#fff;

    letter-spacing:1px;
}

.welcome-container p{

    font-size:
    clamp(16px,2vw,20px);

    opacity:.65;

    margin-bottom:48px;

    max-width:500px;

    margin-left:auto;

    margin-right:auto;
}


/* =========================
   ACTION BUTTONS
========================= */

.action-buttons{

    display:flex;

    gap:20px;

    justify-content:center;

    align-items:center;

    max-width:900px;

    margin:0 auto;
}

.action-btn{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    padding:24px 60px;

    min-width:330px;

    border-radius:24px;

    background:
    rgba(255,255,255,.05);

    border:
    2px solid
    rgba(255,255,255,.2);

    color:#f5f5f5;

    text-decoration:none;

    font-weight:600;

    font-size:24px;

    backdrop-filter:blur(28px);

    box-shadow:
    0 18px 45px
    rgba(0,0,0,.35);

    transition:.35s ease;

    cursor:pointer;
}

.action-btn:hover{

    transform:
    translateY(-6px);

    border-color:
    rgba(255,255,255,.45);

    box-shadow:
    0 0 35px rgba(255,255,255,.14),
    0 24px 55px rgba(0,0,0,.5);

    background:
    rgba(255,255,255,.1);
}

.action-btn i{
    font-size:20px;
}


/* =========================
   LOGIN MODAL
========================= */

.auth-overlay{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.75);

    backdrop-filter:
    blur(12px);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:9999;

    opacity:0;

    visibility:hidden;

    transition:.3s;
}

.auth-overlay.active{

    opacity:1;

    visibility:visible;
}


.auth-box{

    position:relative;

    width:min(410px,90%);

    padding:32px;

    border-radius:24px;

    background:
    rgba(18,18,18,.96);

    border:
    1px solid
    rgba(255,255,255,.18);

    box-shadow:
    0 30px 90px
    rgba(0,0,0,.7);

    transform:
    scale(.9);

    transition:.3s;
}

.auth-overlay.active
.auth-box{

    transform:
    scale(1);
}


/* CLOSE */

.close-auth{

    position:absolute;

    top:16px;

    right:18px;

    width:36px;

    height:36px;

    border:none;

    border-radius:50%;

    background:
    rgba(255,255,255,.08);

    color:#fff;

    font-size:18px;

    cursor:pointer;

    transition:.25s;
}

.close-auth:hover{

    background:
    rgba(255,255,255,.18);

    transform:
    rotate(90deg);
}


/* AUTH TITLE */

.auth-title{

    text-align:center;

    font-size:30px;

    margin-bottom:8px;

    color:#00cfff;

    text-shadow:
    0 0 20px
    rgba(0,207,255,.35);
}

.auth-subtitle{

    text-align:center;

    font-family:'Poppins',sans-serif;

    font-size:13px;

    opacity:.55;

    margin-bottom:25px;
}


/* LOGIN / SIGNUP SWITCH */

.auth-tabs{

    display:flex;

    background:
    rgba(255,255,255,.05);

    padding:5px;

    border-radius:14px;

    margin-bottom:24px;
}

.auth-tab{

    flex:1;

    padding:11px;

    border:none;

    border-radius:11px;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-family:'Poppins',sans-serif;

    font-weight:600;

    transition:.3s;
}

.auth-tab.active{

    background:#fff;

    color:#000;
}


/* INPUT */

.input-group{

    margin-bottom:16px;
}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-family:'Poppins',sans-serif;

    font-size:13px;

    opacity:.7;
}

.input-wrapper{

    position:relative;
}

.input-wrapper i{

    position:absolute;

    left:16px;

    top:50%;

    transform:
    translateY(-50%);

    color:#777;
}

.input-wrapper input{

    width:100%;

    padding:
    14px 45px;

    border-radius:13px;

    border:
    1px solid
    rgba(255,255,255,.13);

    background:
    rgba(255,255,255,.05);

    color:white;

    outline:none;

    font-family:'Poppins',sans-serif;

    transition:.25s;
}

.input-wrapper input:focus{

    border-color:#00cfff;

    box-shadow:
    0 0 0 3px
    rgba(0,207,255,.08);
}


.toggle-password{

    position:absolute;

    right:15px;

    top:50%;

    transform:
    translateY(-50%);

    cursor:pointer;

    color:#888;
}


/* FORGOT PASSWORD */

.auth-options{

    display:flex;

    justify-content:flex-end;

    margin-top:-5px;

    margin-bottom:18px;
}

.forgot-password{

    color:#00cfff;

    text-decoration:none;

    font-family:'Poppins',sans-serif;

    font-size:12px;
}

.forgot-password:hover{
    text-decoration:underline;
}


/* SUBMIT */

.auth-submit{

    width:100%;

    padding:14px;

    border:none;

    border-radius:13px;

    background:#fff;

    color:#000;

    font-family:'Poppins',sans-serif;

    font-weight:700;

    font-size:15px;

    cursor:pointer;

    transition:.3s;
}

.auth-submit:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 0 25px
    rgba(255,255,255,.25);
}


/* CONFIRM PASSWORD */

#confirmPasswordGroup{
    display:none;
}


/* =========================
   FOOTER
========================= */

footer{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    text-align:center;

    padding:20px;

    color:#999;

    font-size:14px;

    z-index:100;

    line-height:1.6;

    border-top:
    1px solid
    rgba(255,255,255,.22);

    background:
    rgba(10,10,10,.18);

    backdrop-filter:
    blur(8px);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    header{
        height:56px;
    }

    nav{
        padding:0 18px;
    }

    .logo{
        font-size:19px;
    }

    .about-btn{
        padding:8px 14px;
        font-size:13px;
    }

    .login-btn{
        padding:8px 14px;
        font-size:13px;
    }

    .page{
        padding-top:56px;
    }

    .welcome-container h1{

        font-size:
        clamp(32px,7vw,54px);

        margin-bottom:16px;
    }

    .welcome-container p{

        font-size:16px;

        margin-bottom:32px;
    }

    .action-buttons{

        gap:12px;

        flex-direction:column;
    }

    .action-btn{

        min-width:100%;

        width:100%;

        max-width:420px;

        padding:20px 50px;

        font-size:20px;
    }

}


@media(max-width:600px){

    .login-btn{

        position:static;

        transform:none;

        padding:7px 12px;

        font-size:11px;

        margin-left:auto;

        margin-right:8px;
    }

    .login-btn:hover{

        transform:
        translateY(-2px);
    }

}


@media(max-width:520px){

    .logo{
        font-size:16px;
    }

    .about-btn{

        font-size:11px;

        padding:7px 10px;
    }

    .welcome-container h1{

        font-size:
        clamp(28px,6vw,40px);

        margin-bottom:12px;
    }

    .welcome-container p{

        font-size:14px;

        margin-bottom:24px;
    }

    .action-btn{

        padding:14px 30px;

        min-width:160px;

        font-size:14px;
    }

    .action-btn i{
        font-size:18px;
    }

    .auth-box{

        padding:
        28px 22px;

        border-radius:20px;
    }

}

</style>
</head>


<body>


<!-- LOADING SCREEN -->

<div id="loadingScreen">

    <div class="loader-logo">
        XENARO
    </div>

</div>


<!-- PARTICLES -->

<div id="particles"></div>


<!-- =========================
     HEADER
========================= -->

<header>

<nav>

    <div class="logo">
        XENARO
    </div>


    <!-- LOGIN / SIGN UP -->

    <button
    class="login-btn"
    id="openAuth">

        <i class="fa-solid fa-user"></i>

        Login / Sign Up

    </button>


    <div class="nav-buttons">

        <a
        class="about-btn"
        href="about/">

            About Me

        </a>

    </div>

</nav>

</header>


<!-- =========================
     PAGE
========================= -->

<main class="page">

<div class="welcome-container">

    <h1>

        WELCOME TO MY

        <span style="color:#00cfff;">
            WEBSITE
        </span>

    </h1>


    <p>
        Explore my gaming and content creation world
    </p>


    <div class="action-buttons">

        <a
        href="gaming/"
        class="action-btn">

            <i class="fa-brands fa-youtube"></i>

            Gaming Channel

        </a>


        <a
        href="editing/"
        class="action-btn">

            <i class="fa-solid fa-film"></i>

            Editing Content

        </a>

    </div>

</div>

</main>


<!-- =========================
     AUTH MODAL
========================= -->

<div
class="auth-overlay"
id="authOverlay">


<div class="auth-box">


    <!-- CLOSE -->

    <button
    class="close-auth"
    id="closeAuth">

        <i class="fa-solid fa-xmark"></i>

    </button>


    <h2 class="auth-title">

        XENARO

    </h2>


    <p
    class="auth-subtitle"
    id="authSubtitle">

        Welcome back! Login to your account.

    </p>


    <!-- TABS -->

    <div class="auth-tabs">


        <button
        class="auth-tab active"
        id="loginTab">

            Login

        </button>


        <button
        class="auth-tab"
        id="signupTab">

            Sign Up

        </button>


    </div>


    <form id="authForm">


        <!-- EMAIL -->

        <div class="input-group">

            <label>
                Email Address
            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                Password
            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>


                <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>


                <span
                class="toggle-password"
                onclick="togglePassword('password',this)">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div
        class="input-group"
        id="confirmPasswordGroup">

            <label>
                Confirm Password
            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>


                <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password">


                <span
                class="toggle-password"
                onclick="togglePassword('confirmPassword',this)">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <div
        class="auth-options"
        id="forgotContainer">

            <a
            href="#"
            class="forgot-password"
            id="forgotPassword">

                Forgot Password?

            </a>

        </div>


        <!-- LOGIN -->

        <button
        type="submit"
        class="auth-submit"
        id="authSubmit">

            Login

        </button>


    </form>


</div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <div>
        XENARO
    </div>

    <div>
        © 2026 All Rights Reserved
    </div>

</footer>


<script>


/* =========================
   LOADER
========================= */

window.addEventListener("load",()=>{

    setTimeout(()=>{

        const loadingScreen =
        document.getElementById(
        "loadingScreen"
        );

        if(loadingScreen){

            loadingScreen.classList.add(
            "fade-out"
            );

            setTimeout(()=>{

                loadingScreen.remove();

            },1000);

        }

    },1200);

});


/* =========================
   HEADER
========================= */

const header =
document.querySelector("header");

window.addEventListener("scroll",()=>{

    header.style.background =
    window.scrollY > 50
    ?
    "rgba(10,10,10,.62)"
    :
    "rgba(10,10,10,.18)";

});


/* =========================
   PARTICLES
========================= */

const particleContainer =
document.getElementById(
"particles"
);


function createParticle(){

    const p =
    document.createElement(
    "span"
    );


    const size =
    Math.random()*6+2;


    p.style.position =
    "absolute";

    p.style.width =
    size+"px";

    p.style.height =
    size+"px";

    p.style.borderRadius =
    "50%";

    p.style.background =
    "#ffffff";

    p.style.opacity =
    Math.random()*0.6;

    p.style.left =
    Math.random()*100+"vw";

    p.style.top =
    "110vh";

    p.style.boxShadow =
    "0 0 20px rgba(255,255,255,.6)";


    particleContainer.appendChild(
    p
    );


    const speed =
    Math.random()*5+6;


    let y=110;


    const move =
    setInterval(()=>{

        y-=0.2;

        p.style.top =
        y+"vh";


        if(y<-10){

            clearInterval(
            move
            );

            p.remove();

        }

    },speed);

}


setInterval(
createParticle,
120
);


/* =========================
   LOGIN MODAL
========================= */

const openAuth =
document.getElementById(
"openAuth"
);

const closeAuth =
document.getElementById(
"closeAuth"
);

const authOverlay =
document.getElementById(
"authOverlay"
);


openAuth.addEventListener(
"click",
()=>{

    authOverlay.classList.add(
    "active"
    );

});


closeAuth.addEventListener(
"click",
()=>{

    authOverlay.classList.remove(
    "active"
    );

});


authOverlay.addEventListener(
"click",
(e)=>{

    if(e.target === authOverlay){

        authOverlay.classList.remove(
        "active"
        );

    }

});


document.addEventListener(
"keydown",
(e)=>{

    if(e.key==="Escape"){

        authOverlay.classList.remove(
        "active"
        );

    }

});


/* =========================
   LOGIN / SIGNUP SWITCH
========================= */

const loginTab =
document.getElementById(
"loginTab"
);

const signupTab =
document.getElementById(
"signupTab"
);

const confirmPasswordGroup =
document.getElementById(
"confirmPasswordGroup"
);

const confirmPassword =
document.getElementById(
"confirmPassword"
);

const forgotContainer =
document.getElementById(
"forgotContainer"
);

const authSubmit =
document.getElementById(
"authSubmit"
);

const authSubtitle =
document.getElementById(
"authSubtitle"
);


loginTab.addEventListener(
"click",
()=>{

    loginTab.classList.add(
    "active"
    );

    signupTab.classList.remove(
    "active"
    );


    confirmPasswordGroup.style.display =
    "none";


    confirmPassword.required =
    false;


    forgotContainer.style.display =
    "flex";


    authSubmit.textContent =
    "Login";


    authSubtitle.textContent =
    "Welcome back! Login to your account.";

});


signupTab.addEventListener(
"click",
()=>{

    signupTab.classList.add(
    "active"
    );

    loginTab.classList.remove(
    "active"
    );


    confirmPasswordGroup.style.display =
    "block";


    confirmPassword.required =
    true;


    forgotContainer.style.display =
    "none";


    authSubmit.textContent =
    "Create Account";


    authSubtitle.textContent =
    "Create your Xenaro account.";

});


/* =========================
   PASSWORD VISIBILITY
========================= */

function togglePassword(
inputId,
element
){

    const input =
    document.getElementById(
    inputId
    );

    const icon =
    element.querySelector(
    "i"
    );


    if(input.type==="password"){

        input.type="text";

        icon.classList.remove(
        "fa-eye"
        );

        icon.classList.add(
        "fa-eye-slash"
        );

    }
    else{

        input.type="password";

        icon.classList.remove(
        "fa-eye-slash"
        );

        icon.classList.add(
        "fa-eye"
        );

    }

}


/* =========================
   FORM DEMO
========================= */

const authForm =
document.getElementById(
"authForm"
);


authForm.addEventListener(
"submit",
(e)=>{

    e.preventDefault();


    const email =
    document.getElementById(
    "email"
    ).value;


    const password =
    document.getElementById(
    "password"
    ).value;


    if(
    signupTab.classList.contains(
    "active"
    )
    ){

        const confirm =
        confirmPassword.value;


        if(password !== confirm){

            alert(
            "Passwords do not match."
            );

            return;

        }


        alert(
        "Sign Up UI works! Backend authentication still needs to be connected."
        );

    }

    else{

        alert(
        "Login UI works! Backend authentication still needs to be connected."
        );

    }

});

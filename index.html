<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
/* ==========================
   XENARO
   Black & White Theme
========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

html, body{
    height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    overflow:hidden;
}

::-webkit-scrollbar{
    width:10px;
}
::-webkit-scrollbar-track{
    background:#0f0f0f;
}
::-webkit-scrollbar-thumb{
    background:#ffffff;
    border-radius:100px;
}

#loader{
position:fixed;
inset:0;
background:#000000;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
transition:1s;
}

.loader-logo{
font-size:60px;
font-weight:800;
letter-spacing:10px;
color:#00cfff;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);text-shadow:0 0 20px #00cfff,0 0 50px #00cfff;}
100%{transform:scale(1);}
}

header{
position:fixed;
top:0;
left:0;
width:100%;
height:64px;
z-index:500;
backdrop-filter:blur(18px);
background:rgba(0,0,0,.5);
border-bottom:1px solid rgba(255,255,255,.12);
}

nav{
max-width:1680px;
height:100%;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 clamp(24px,4vw,64px);
}

.nav-buttons{
display:flex;
gap:12px;
align-items:center;
position:relative;
z-index:501;
}

.logo{
font-size:24px;
font-weight:800;
letter-spacing:2px;
color:#00cfff;
text-shadow:0 0 12px #00cfff, 0 0 30px rgba(0,207,255,.6);
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav a{
color:#f5f5f5;
text-decoration:none;
font-weight:500;
font-size:14px;
transition:.35s;
}

nav a:hover{
color:#ffffff;
opacity:.7;
}

.about-btn, .join-btn{
padding:9px 20px;
background:#ffffff;
border-radius:40px;
color:#000000;
font-weight:700;
font-size:14px;
text-decoration:none;
transition:.4s;
position:relative;
z-index:10;
text-shadow:0 1px 2px rgba(0,0,0,.1);
}

.about-btn:hover, .join-btn:hover{
transform:translateY(-3px);
box-shadow:0 0 30px rgba(255,255,255,.5), inset 0 0 15px rgba(255,255,255,.3);
color:#000000;
}

.mobile-notice{
display:none;
}

/* ---- One-page layout ---- */

.page{
height:100vh;
padding-top:64px;
display:flex;
flex-direction:column;
max-width:1680px;
margin:auto;
}

.top-row{
flex:1.15;
min-height:0;
display:grid;
grid-template-columns:1.1fr .9fr;
align-items:center;
gap:clamp(20px,4vw,90px);
padding:1.5vh clamp(24px,4vw,64px);
}

.hero h1{
font-size:clamp(30px,4.2vw,60px);
line-height:1.05;
font-weight:800;
margin-bottom:14px;
}

.hero p{
font-size:clamp(13px,1.4vw,19px);
opacity:.7;
}

.hero-right{
perspective:1200px;
position:relative;
z-index:100;
}

.glass-card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
padding:clamp(20px,3vh,32px);
backdrop-filter:blur(30px);
box-shadow:0 0 40px rgba(255,255,255,.1), 0 25px 60px rgba(0,0,0,.55);
transition:box-shadow .3s ease, transform .1s ease-out;
transform-style:preserve-3d;
will-change:transform;
}

.glass-card:hover{
box-shadow:0 0 55px rgba(255,255,255,.35), 0 35px 70px rgba(0,0,0,.6);
}

.card-layer{
transform-style:preserve-3d;
}

.glass-card h2{
font-size:clamp(20px,2.4vw,30px);
margin-bottom:4px;
transform:translateZ(45px);
text-shadow:0 8px 20px rgba(0,0,0,.5);
}

.glass-card > .card-layer > p{
font-size:13px;
opacity:.65;
transform:translateZ(35px);
}

.stats{
display:flex;
justify-content:space-between;
margin-top:20px;
transform:translateZ(30px);
}

.stats h3{
font-size:clamp(18px,2vw,26px);
color:#ffffff;
}

.stats span{
opacity:.6;
font-size:12px;
}

.bottom-row{
flex:.6;
min-height:0;
display:flex;
align-items:center;
justify-content:center;
padding:0 clamp(24px,4vw,64px);
}

.social-links{
display:flex;
gap:22px;
align-items:center;
justify-content:center;
}

.social-link{
display:flex;
align-items:center;
gap:10px;
padding:12px 22px;
border-radius:40px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
color:#f5f5f5;
font-size:16px;
text-decoration:none;
transition:.35s;
}

.social-link span{
font-size:14px;
font-weight:500;
}

.social-link{
position:relative;
}

.social-link::after{
content:attr(data-label);
position:absolute;
bottom:100%;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.95);
color:#ffffff;
padding:6px 12px;
border-radius:6px;
font-size:12px;
font-weight:600;
white-space:nowrap;
opacity:0;
pointer-events:none;
transition:opacity .3s ease;
margin-bottom:8px;
}

.social-link:hover{
transform:translateY(-5px);
color:#ffffff;
border-color:#ffffff;
box-shadow:0 0 25px rgba(255,255,255,.4);
}

.social-link:hover::after{
opacity:1;
}

footer{
flex:0 0 auto;
padding:10px;
text-align:center;
border-top:1px solid rgba(255,255,255,.12);
color:#999;
font-size:11px;
}

footer h2{
font-size:13px;
margin-bottom:2px;
color:#f5f5f5;
}

@media(max-width:900px){
html, body{
height:auto;
overflow-x:hidden;
overflow-y:auto;
}

body{
overflow:auto;
}

.mobile-notice{
display:block;
background:rgba(0,207,255,.1);
border:1px solid rgba(0,207,255,.3);
border-radius:12px;
padding:14px 16px;
margin:12px 16px 0;
text-align:center;
font-size:13px;
color:#f5f5f5;
opacity:.85;
line-height:1.5;
margin-top:70px;
}

.mobile-notice p{
margin:0;
}

.page{
height:auto;
padding-top:60px;
flex-direction:column;
gap:40px;
}

header{
height:56px;
}

nav{
padding:0 20px;
}

.logo{
font-size:19px;
}

.nav-buttons{
gap:8px;
}

.about-btn, .join-btn{
padding:7px 16px;
font-size:12.5px;
text-shadow:0 1px 2px rgba(0,0,0,.1);
}

nav ul{
display:none;
}

.top-row{
grid-template-columns:1fr;
text-align:center;
padding:40px 20px 35px;
gap:32px;
flex:none;
min-height:auto;
margin-bottom:0;
}

.hero h1{
font-size:38px;
letter-spacing:-.5px;
line-height:1.2;
margin-bottom:16px;
}

.hero p{
font-size:14px;
line-height:1.6;
max-width:100%;
margin:0 auto;
opacity:.8;
}

.hero-right{
perspective:1200px;
}

.glass-card{
padding:24px 20px;
border-radius:20px;
width:100%;
max-width:320px;
margin:0 auto;
}

.glass-card:hover{
box-shadow:0 0 40px rgba(255,255,255,.1), 0 25px 60px rgba(0,0,0,.55);
transform:none;
}

.glass-card h2{
font-size:24px;
margin-bottom:6px;
transform:none;
}

.glass-card > .card-layer > p{
font-size:13px;
opacity:.65;
transform:none;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:24px;
padding-top:24px;
border-top:1px solid rgba(255,255,255,.1);
transform:none;
text-align:center;
}

.stats > div{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.stats h3{
font-size:20px;
margin:0;
}

.stats span{
font-size:11px;
letter-spacing:.3px;
white-space:nowrap;
opacity:.7;
margin-top:4px;
}

.bottom-row{
flex:none;
min-height:auto;
padding:20px 20px 30px;
margin-bottom:0;
width:100%;
}

.social-links{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
align-items:center;
max-width:100%;
margin:0 auto;
row-gap:12px;
}

.social-link{
padding:11px 16px;
justify-content:center;
font-size:13px;
flex:0 1 calc(50% - 5px);
max-width:160px;
}

.social-link span{
font-size:12px;
}

.social-link i{
font-size:16px;
}

footer{
padding:18px 20px;
margin-top:auto;
flex:0 0 auto;
}

footer h2{
font-size:14px;
margin-bottom:4px;
}

footer p{
font-size:11px;
}
}
</style>
</head>
<body>

<div class="loader-logo">XENARO</div>
</div>

<header>
<nav>
<div class="logo">XENARO</div>
<div class="nav-buttons">

<p>Gooning Was Never A Bad Thing.</p>
</div>
<div class="hero-right">

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loader").style.opacity = "0";
        document.getElementById("loader").style.pointerEvents = "none";
    }, 1200);
});

const header = document.querySelector("header");
window.addEventListener("scroll", () => {
    header.style.background = window.scrollY > 50 ? "rgba(0,0,0,.8)" : "rgba(0,0,0,.5)";
});

const particleContainer = document.getElementById("particles");
function createParticle(){
    const p = document.createElement("span");
    const size = Math.random() * 6 + 2;
    p.style.position = "absolute";
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.borderRadius = "50%";
    p.style.background = "#ffffff";
    p.style.opacity = Math.random() * 0.6;
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "110vh";
    p.style.boxShadow = "0 0 20px rgba(255,255,255,.6)";
    particleContainer.appendChild(p);
    
    const speed = Math.random() * 5 + 6;
    let y = 110;
    const move = setInterval(() => {
        y -= 0.2;
        p.style.top = y + "vh";
        if(y < -10){
            clearInterval(move);
            p.remove();
        }
    }, speed);
}
setInterval(createParticle, 120);

document.querySelectorAll("section").forEach((section, i) => {
    section.style.opacity = "0";
    section.style.transform = "translateY(30px)";
    section.style.transition = ".7s";
    setTimeout(() => {
        section.style.opacity = "1";
        section.style.transform = "translateY(0px)";
    }, 150 + i * 120);
});

const hero = document.querySelector(".hero-left h1");
if(hero){
    hero.animate([
        { opacity: 0, transform: "translateY(40px)" },
        { opacity: 1, transform: "translateY(0px)" }
    ], { duration: 1200, fill: "forwards" });
}

document.querySelectorAll(".glass-card").forEach(card => {
    card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rx = (y - rect.height / 2) / 18;
        const ry = (rect.width / 2 - x) / 18;
        card.style.transform = `perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.02,1.02,1.02)`;
    });
    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)";
    });
});
</script>

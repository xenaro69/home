<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XENARO - Content Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
/* ==========================
   XENARO - MAIN HUB
   Black & White Theme
========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

html, body{
    height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    display:flex;
    flex-direction:column;
    height:100vh;
}

::-webkit-scrollbar{
    width:10px;
}
::-webkit-scrollbar-track{
    background:#0f0f0f;
}
::-webkit-scrollbar-thumb{
    background:#ffffff;
    border-radius:100px;
}

#loader{
    position:fixed;
    inset:0;
    background:#000000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:1s;
}

.loader-logo{
    font-size:60px;
    font-weight:800;
    letter-spacing:10px;
    color:#00cfff;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);text-shadow:0 0 20px #00cfff,0 0 50px #00cfff;}
    100%{transform:scale(1);}
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(18px);
    background:rgba(0,0,0,.5);
    border-bottom:1px solid rgba(255,255,255,.12);
}

nav{
    max-width:1680px;
    height:100%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff, 0 0 30px rgba(0,207,255,.6);
}

.nav-buttons{
    display:flex;
    align-items:center;
    gap:20px;
}

nav a{
    color:#f5f5f5;
    text-decoration:none;
    font-weight:500;
    font-size:14px;
    transition:.35s;
}

nav a:hover{
    color:#ffffff;
}

.about-btn{
    padding:8px 20px;
    background:#ffffff;
    color:#000000;
    border:none;
    border-radius:40px;
    font-weight:700;
    font-size:12px;
    text-decoration:none;
    cursor:pointer;
    transition:.35s;
    display:inline-block;
}

.about-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(255,255,255,.5);
    color:#000000;
}

.join-btn{
    display:none;
}

.container{
    max-width:1680px;
    margin:auto;
    padding:0 clamp(24px,4vw,64px);
    height:100%;
    display:flex;
    flex-direction:column;
}

/* Main Content Wrapper */
.main-content{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

/* Hero Section */
.hero-section{
    padding-top:30px;
    padding-left:clamp(24px,4vw,64px);
    padding-right:clamp(24px,4vw,64px);
    padding-bottom:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    flex:1;
}

.hero-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.profile-photo{
    width:175px;
    height:175px;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(0,207,255,.3), rgba(0,207,255,.1));
    border:2px solid rgba(0,207,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    color:#00cfff;
    text-shadow:0 0 20px #00cfff;
    margin-bottom:12px;
    box-shadow:0 0 40px rgba(0,207,255,.2);
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
}

.profile-photo:hover{
    box-shadow:0 0 55px rgba(0,207,255,.4);
    transform:scale(1.03);
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
}

.hero-content h1{
    font-size:clamp(32px,2.9vw,46px);
    font-weight:800;
    margin-bottom:6px;
    line-height:1.2;
}

.hero-content p{
    font-size:clamp(14px,1.3vw,18px);
    opacity:.7;
    margin-bottom:0;
}

.hero-highlight{
    color:#00cfff;
    text-shadow:0 0 12px #00cfff;
}

/* Cards Grid */
.cards-section{
    display:flex;
    justify-content:center;
    width:100%;
}

.section-title{
    display:none;
}

.cards-grid{
    display:flex;
    flex-direction:row;
    gap:clamp(14px,1.7vw,18px);
    max-width:82%;
    justify-content:center;
}

.card-item{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:20px 24px;
    backdrop-filter:blur(30px);
    cursor:pointer;
    transition:.35s ease;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:14px;
    transform-style:preserve-3d;
    perspective:1200px;
    position:relative;
    overflow:hidden;
    flex:1;
    min-width:200px;
    text-align:left;
}

.card-item::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(0,207,255,.1) 0%, transparent 100%);
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
}

.card-item:hover{
    transform:translateY(-8px);
    box-shadow:0 0 55px rgba(255,255,255,.35), 0 35px 70px rgba(0,0,0,.6);
    border-color:rgba(0,207,255,.5);
}

.card-item:hover::before{
    opacity:1;
}

.card-icon{
    font-size:32px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff;
    flex-shrink:0;
    min-width:32px;
}

.card-content{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex:1;
}

.card-item h3{
    font-size:clamp(17px,1.8vw,20px);
    font-weight:700;
    margin:0;
}

.card-item p{
    font-size:13px;
    opacity:.6;
    margin:0;
    line-height:1.3;
}

.card-meta{
    display:none;
}

.card-meta span{
    display:flex;
    gap:6px;
    align-items:center;
}

.card-arrow{
    font-size:18px;
    color:#00cfff;
    opacity:1;
    transition:opacity .35s ease, transform .35s ease;
    flex-shrink:0;
}

.card-item:hover .card-arrow{
    opacity:1;
    transform:translateX(4px);
}

/* About Section */
.about-section{
    display:none;
}

.about-content{
    display:none;
}

.about-text h2{
    display:none;
}

.about-text p{
    display:none;
}

.about-stats{
    display:none;
}

.stat-item h4{
    display:none;
}

.stat-item p{
    display:none;
}

.about-visual{
    display:none;
}

.about-visual i{
    display:none;
}

.about-visual h3{
    display:none;
}

/* Footer */
footer{
    flex:0 0 auto;
    padding:12px 10px 10px 10px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.12);
    color:#999;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
}

footer h2{
    font-size:13px;
    margin:0;
    color:#f5f5f5;
    font-weight:800;
    letter-spacing:2px;
}

footer p{
    margin:0;
    font-size:11px;
    color:#666;
    font-weight:500;
}

.about-me-btn{
    display:none;
}

/* Image Modal */
#imageModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:7000;
    background:rgba(0,0,0,.95);
    backdrop-filter:blur(5px);
    align-items:center;
    justify-content:center;
    animation:fadeInModal .3s ease-out;
}

#imageModal.active{
    display:flex;
}

@keyframes fadeInModal{
    from{ opacity:0; }
    to{ opacity:1; }
}

.modal-content{
    position:relative;
    max-width:85vw;
    max-height:85vh;
}

.modal-img{
    width:100%;
    height:100%;
    max-width:85vw;
    max-height:85vh;
    object-fit:contain;
    border-radius:12px;
    display:block;
}

.modal-close{
    position:absolute;
    top:-40px;
    right:0;
    background:none;
    border:none;
    color:#ffffff;
    font-size:32px;
    cursor:pointer;
    transition:.3s;
    padding:0;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-close:hover{
    color:#00cfff;
    transform:rotate(90deg);
}

/* Particles */
#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

#particles span{
    position:absolute;
    will-change:transform;
}

/* Mobile */
@media(max-width:768px){
    .nav-buttons{
        gap:10px;
    }

    .about-btn{
        padding:7px 16px;
        font-size:11px;
    }

    .hero-section{
        min-height:auto;
        gap:20px;
        padding-top:80px;
    }

    .hero-content{
        width:100%;
        padding:20px;
    }

    .profile-photo{
        width:100px;
        height:100px;
        font-size:40px;
    }

    .hero-content h1{
        font-size:24px;
    }

    .hero-content p{
        font-size:12px;
    }

    .cards-section{
        width:100%;
        padding:0 20px;
        margin-bottom:20px;
    }

    .cards-grid{
        gap:10px;
        max-width:100%;
        flex-direction:row;
    }

    .card-item{
        padding:14px 16px;
        min-width:auto;
        flex-direction:column;
        text-align:center;
    }

    .card-icon{
        font-size:24px;
    }

    .card-item h3{
        font-size:14px;
    }

    .card-item p{
        font-size:11px;
    }

    footer{
        padding:16px 15px;
        border-top:1px solid rgba(255,255,255,.12);
        font-size:11px;
    }

    footer h2{
        font-size:14px;
        margin-bottom:4px;
    }

    footer p{
        font-size:10px;
    }
}

/* Animations */
@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero-content, .cards-grid, .about-content{
    animation:fadeInUp .7s ease-out forwards;
}

.cards-grid > *{
    animation:fadeInUp .7s ease-out forwards;
}

.cards-grid > *:nth-child(1){ animation-delay:.1s; }
.cards-grid > *:nth-child(2){ animation-delay:.2s; }
.cards-grid > *:nth-child(3){ animation-delay:.3s; }
.cards-grid > *:nth-child(4){ animation-delay:.4s; }
</style>
</head>
<body>
<div id="loader">
    <div class="loader-logo">XENARO</div>
</div>
<div id="particles"></div>

<header>
    <nav>
        <div class="logo">XENARO</div>
        <div class="nav-buttons">
            <a class="about-btn" href="about/">About Me</a>
            <a class="join-btn" href="https://discord.gg/C64h96EGR7" target="_blank">Join Now</a>
        </div>
    </nav>
</header>

<div class="main-content">
    <section class="hero-section">
        <div class="hero-content">
            <div class="profile-photo" id="profilePhotoTrigger">
                <img src="favicon.png" alt="Xenaro" onerror="this.remove(); this.parentElement.innerHTML='<i class=\'fas fa-user\'></i>';">
            </div>
            <h1>Welcome To My Website</h1>
            <p>Explore & Drop feedbacks</p>
        </div>

        <div id="imageModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeImageModal()">&times;</button>
                <img src="favicon.png" alt="Xenaro" class="modal-img">
            </div>
        </div>

        <div class="cards-section">
            <div class="cards-grid">
                <a href="gaming/" class="card-item">
                    <div class="card-icon">
                        <i class="fas fa-gamepad"></i>
                    </div>
                    <div class="card-content">
                        <h3>Gaming</h3>
                        <p>Minecraft, Gameplay, Challenges</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

                <a href="editing.html" class="card-item">
                    <div class="card-icon">
                        <i class="fas fa-film"></i>
                    </div>
                    <div class="card-content">
                        <h3>Editing</h3>
                        <p>Anime Edits, Gaming Edits, Video Production</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

                <a href="vlogs.html" class="card-item">
                    <div class="card-icon">
                        <i class="fas fa-vial"></i>
                    </div>
                    <div class="card-content">
                        <h3>Vlogs</h3>
                        <p>Real Life, Experience, Behind the Scene</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <h2>XENARO</h2>
        <p>© 2026 All Rights Reserved.</p>
    </footer>
</div>

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loader").style.opacity = "0";
        document.getElementById("loader").style.pointerEvents = "none";
    }, 1200);
});

const profilePhotoTrigger = document.getElementById("profilePhotoTrigger");
const imageModal = document.getElementById("imageModal");

profilePhotoTrigger.addEventListener("click", () => {
    imageModal.classList.add("active");
});

function closeImageModal(){
    imageModal.classList.remove("active");
}

imageModal.addEventListener("click", (e) => {
    if(e.target === imageModal){
        closeImageModal();
    }
});

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && imageModal.classList.contains("active")){
        closeImageModal();
    }
});

const header = document.querySelector("header");
window.addEventListener("scroll", () => {
    header.style.background = window.scrollY > 50 ? "rgba(0,0,0,.8)" : "rgba(0,0,0,.5)";
});

const particleContainer = document.getElementById("particles");
function createParticle(){
    const p = document.createElement("span");
    const size = Math.random() * 6 + 2;
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.borderRadius = "50%";
    p.style.background = "#ffffff";
    p.style.opacity = Math.random() * 0.6;
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "110vh";
    p.style.boxShadow = "0 0 20px rgba(255,255,255,.6)";
    particleContainer.appendChild(p);
    
    const speed = Math.random() * 5 + 6;
    let y = 110;
    const move = setInterval(() => {
        y -= 0.2;
        p.style.top = y + "vh";
        if(y < -10){
            clearInterval(move);
            p.remove();
        }
    }, speed);
}
setInterval(createParticle, 120);

document.querySelectorAll(".card-item").forEach(card => {
    card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rx = (y - rect.height / 2) / 25;
        const ry = (rect.width / 2 - x) / 25;
        card.style.transform = `perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.01,1.01,1.01)`;
    });
    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)";
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

@font-face{
    font-family:'Sunrise Brown';
    src:url('Sunrise Brown.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    width:100%;
    height:100vh;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity 1s ease-out;
}

#loadingScreen.fade-out{
    opacity:0;
    pointer-events:none;
}

.loader-logo{
    font-size:clamp(32px,5vw,48px);
    font-weight:800;
    letter-spacing:10px;
    color:#00cfff;
    animation:pulse 1.2s infinite;
    text-shadow:0 0 12px #00cfff;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{
        transform:scale(1.1);
        text-shadow:0 0 20px #00cfff,0 0 50px #00cfff;
    }
    100%{transform:scale(1);}
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(8px);
    background:rgba(10,10,10,.18);
    border-bottom:1px solid rgba(255,255,255,.22);
}

nav{
    max-width:1680px;
    height:100%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
    width:100%;
    position:relative;
}

.logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
}

.login-btn{
    position:static;
    transform:none;
    padding:10px 22px;
    background:#fff;
    border:none;
    border-radius:40px;
    color:#000;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.35s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

.nav-buttons{
    display:flex;
    gap:12px;
    align-items:center;
}

.about-btn{
    padding:10px 22px;
    background:#fff;
    border-radius:40px;
    color:#000;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    transition:.35s;
}

.about-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

.page{
    position:relative;
    z-index:2;
    flex:1;
    padding-top:64px;
    padding-bottom:80px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.welcome-container{
    text-align:center;
}

.welcome-container h1{
    font-size:clamp(42px,6vw,72px);
    font-weight:800;
    margin-bottom:24px;
    color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,.75),0 0 24px rgba(255,255,255,.38),0 0 46px rgba(0,207,255,.22);
}

.welcome-container h1 span{
    text-shadow:0 0 10px #00cfff,0 0 25px rgba(0,207,255,.85),0 0 50px rgba(0,207,255,.5);
}

.welcome-container p{
    font-size:clamp(16px,2vw,20px);
    opacity:.65;
    margin-bottom:48px;
}

.action-buttons{
    display:flex;
    gap:20px;
    justify-content:center;
}

.action-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:24px 60px;
    min-width:330px;
    border-radius:24px;
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.2);
    color:#f5f5f5;
    text-decoration:none;
    font-weight:600;
    font-size:24px;
    transition:.35s;
}

.action-btn:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.1);
}

.auth-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.auth-overlay.active{
    opacity:1;
    visibility:visible;
}

.auth-box{
    position:relative;
    width:min(820px,92%);
    padding:40px 48px;
    border-radius:24px;
    background:#111;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

.auth-box,
.auth-box button,
.auth-box input,
.auth-box label,
.auth-box a,
.auth-box p,
.auth-box div,
.auth-box span{
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

.close-auth{
    position:absolute;
    top:15px;
    right:15px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
}

.auth-title{
    text-align:center;
    font-size:34px;
    color:#00cfff;
    margin-bottom:5px;
    letter-spacing:2px;
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

.auth-subtitle{
    text-align:center;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-size:15px;
    opacity:.55;
    margin-bottom:25px;
}

.auth-tabs{
    display:flex;
    background:rgba(255,255,255,.05);
    padding:5px;
    border-radius:14px;
    margin-bottom:24px;
}

.auth-tab{
    flex:1;
    padding:13px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:#aaa;
    font-weight:600;
    cursor:pointer;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-size:15px;
}

.auth-tab.active{
    background:#fff;
    color:#000;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-size:14px;
    opacity:.7;
}

.input-wrapper{
    position:relative;
}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
}

.input-wrapper input{
    width:100%;
    padding:15px 45px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:white;
    outline:none;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-size:15px;
}

.input-wrapper input::placeholder{
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

.password-eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#888;
}

.auth-options{
    display:flex;
    justify-content:flex-end;
    margin-bottom:18px;
}

.forgot-password{
    color:#00cfff;
    text-decoration:none;
    font-size:13px;
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

.auth-submit{
    width:100%;
    padding:15px;
    border:none;
    border-radius:13px;
    background:#fff;
    color:#000;
    font-weight:700;
    cursor:pointer;
    font-size:15px;
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

.auth-message{
    margin-top:15px;
    text-align:center;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-size:13px;
    min-height:20px;
}

#confirmPasswordGroup{
    display:none;
}

.otp-stage{display:none;}
.otp-note{text-align:center;font-size:14px;opacity:.65;margin:0 0 18px;line-height:1.6;}
.otp-email{color:#00cfff;word-break:break-all;}
#otp{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700;padding-left:45px;}
.otp-actions{display:flex;gap:10px;margin-top:12px;}
.otp-secondary{flex:1;padding:13px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-family:'Sunrise Brown','Poppins',sans-serif;}
.otp-secondary:disabled{opacity:.5;cursor:not-allowed;}

.account-box{
    display:none;
    text-align:center;
}

.account-email{
    font-family:'Sunrise Brown','Poppins',sans-serif;
    margin-bottom:20px;
    font-size:15px;
    color:#ccc;
    word-break:break-all;
}

.logout-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:13px;
    background:#fff;
    color:#000;
    font-weight:700;
    cursor:pointer;
    font-size:15px;
    font-family:'Sunrise Brown','Poppins',sans-serif;
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    text-align:center;
    padding:20px;
    color:#999;
    font-size:14px;
    z-index:100;
    line-height:1.6;
    border-top:1px solid rgba(255,255,255,.22);
    background:rgba(10,10,10,.18);
    backdrop-filter:blur(8px);
}

@media(max-width:900px){

    .action-buttons{
        flex-direction:column;
    }

    .action-btn{
        min-width:100%;
        max-width:420px;
    }

    .auth-box{
        width:min(650px,92%);
        padding:35px;
    }
}

@media(max-width:600px){

    .login-btn{
        position:static;
        transform:none;
        margin-left:0;
        margin-right:8px;
        font-size:11px;
        padding:7px 11px;
    }

    .login-btn:hover{
        transform:translateY(-2px);
    }

    .logo{
        font-size:16px;
    }

    .about-btn{
        font-size:11px;
        padding:7px 10px;
    }

    .auth-box{
        width:92%;
        padding:28px 22px;
    }
}


/* White click/touch circle fade effect */
.click-circle{
    position:fixed;
    width:18px;
    height:18px;
    left:0;
    top:0;
    border:2px solid #fff;
    border-radius:50%;
    pointer-events:none;
    z-index:99998;
    transform:translate(-50%,-50%) scale(.2);
    opacity:.95;
    box-shadow:0 0 8px rgba(255,255,255,.65);
    animation:clickCircleFade .6s ease-out forwards;
}
@keyframes clickCircleFade{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:.95;}
    100%{transform:translate(-50%,-50%) scale(3.2);opacity:0;}
}

</style>
</head>

<body>

<div id="loadingScreen">
    <div class="loader-logo">XENARO</div>
</div>

<div id="particles"></div>

<header>
<nav>

    <div class="logo">
        XENARO
    </div>

    <button class="login-btn" id="openAuth">
        <i class="fa-solid fa-user"></i>
        <span id="loginButtonText">Login / Sign Up</span>
    </button>

    <div class="nav-buttons">
        <a class="about-btn" href="about/">
            About Me
        </a>
    </div>

</nav>
</header>

<main class="page">

<div class="welcome-container">

    <h1>
        WELCOME TO MY
        <span style="color:#00cfff;">
            WEBSITE
        </span>
    </h1>

    <p>
        Explore my gaming and content creation world
    </p>

    <div class="action-buttons">

        <a href="gaming/" class="action-btn">
            <i class="fa-brands fa-youtube"></i>
            Gaming Channel
        </a>

        <a href="editing/" class="action-btn">
            <i class="fa-solid fa-film"></i>
            Editing Content
        </a>

    </div>

</div>

</main>

<div class="auth-overlay" id="authOverlay">

<div class="auth-box">

    <button class="close-auth" id="closeAuth">
        <i class="fa-solid fa-xmark"></i>
    </button>

    <h2 class="auth-title">
        XENARO
    </h2>

    <div id="authArea">

        <p class="auth-subtitle" id="authSubtitle">Login or create an account with a secure email OTP.</p>

        <form id="authForm">
            <div id="emailStage">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <button type="submit" class="auth-submit" id="authSubmit">Send OTP</button>
            </div>

            <div class="otp-stage" id="otpStage">
                <p class="otp-note">We sent a verification code to<br><span class="otp-email" id="otpEmail"></span></p>
                <div class="input-group">
                    <label>Verification Code</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="text" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter OTP">
                    </div>
                </div>
                <button type="button" class="auth-submit" id="verifyOtpButton">Verify & Continue</button>
                <div class="otp-actions">
                    <button type="button" class="otp-secondary" id="changeEmailButton">Change Email</button>
                    <button type="button" class="otp-secondary" id="resendOtpButton" disabled>Resend in 60s</button>
                </div>
            </div>

            <div class="auth-message" id="authMessage"></div>
        </form>
    </div>

    <div
    class="account-box"
    id="accountArea">

        <p class="auth-subtitle">
            You are logged in as
        </p>

        <div
        class="account-email"
        id="accountEmail">
        </div>

        <button
        class="logout-btn"
        id="logoutButton">

            Logout

        </button>

    </div>

</div>

</div>

<footer>

    <div>XENARO</div>

    <div>
        © 2026 All Rights Reserved
    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* Create a fading white circle wherever the user clicks or touches */
function createClickCircle(x,y){
    const circle=document.createElement("span");
    circle.className="click-circle";
    circle.style.left=x+"px";
    circle.style.top=y+"px";
    document.body.appendChild(circle);
    circle.addEventListener("animationend",()=>circle.remove());
}
document.addEventListener("pointerdown",(e)=>{
    createClickCircle(e.clientX,e.clientY);
});


const SUPABASE_URL =
"https://bvmcuoiprayzeksljnyo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RlXQ4_mUAhiKxuTsxGLU-Q_ILaQT_8C";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

window.addEventListener("load",()=>{
    setTimeout(()=>{
        const loadingScreen=document.getElementById("loadingScreen");
        if(loadingScreen){
            loadingScreen.classList.add("fade-out");
            setTimeout(()=>loadingScreen.remove(),1000);
        }
    },1200);
});

const openAuth=document.getElementById("openAuth");
const closeAuth=document.getElementById("closeAuth");
const authOverlay=document.getElementById("authOverlay");
const authForm=document.getElementById("authForm");
const authSubmit=document.getElementById("authSubmit");
const authMessage=document.getElementById("authMessage");
const authArea=document.getElementById("authArea");
const accountArea=document.getElementById("accountArea");
const accountEmail=document.getElementById("accountEmail");
const logoutButton=document.getElementById("logoutButton");
const loginButtonText=document.getElementById("loginButtonText");
const emailStage=document.getElementById("emailStage");
const otpStage=document.getElementById("otpStage");
const otpEmail=document.getElementById("otpEmail");
const otpInput=document.getElementById("otp");
const verifyOtpButton=document.getElementById("verifyOtpButton");
const resendOtpButton=document.getElementById("resendOtpButton");
const changeEmailButton=document.getElementById("changeEmailButton");
let pendingEmail="";
let resendTimer=null;

openAuth.addEventListener("click",()=>authOverlay.classList.add("active"));
closeAuth.addEventListener("click",()=>authOverlay.classList.remove("active"));
authOverlay.addEventListener("click",e=>{if(e.target===authOverlay)authOverlay.classList.remove("active");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")authOverlay.classList.remove("active");});

function setMessage(text,color="#aaa"){authMessage.style.color=color;authMessage.textContent=text;}
function startResendTimer(){
    clearInterval(resendTimer);
    let left=60; resendOtpButton.disabled=true; resendOtpButton.textContent=`Resend in ${left}s`;
    resendTimer=setInterval(()=>{
        left--; resendOtpButton.textContent=left>0?`Resend in ${left}s`:"Resend OTP";
        if(left<=0){clearInterval(resendTimer);resendOtpButton.disabled=false;}
    },1000);
}
async function sendOtp(email){
    const {error}=await supabaseClient.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    if(error) throw error;
    pendingEmail=email; otpEmail.textContent=email; emailStage.style.display="none"; otpStage.style.display="block";
    otpInput.value=""; otpInput.focus(); startResendTimer();
}

authForm.addEventListener("submit",async e=>{
    e.preventDefault();
    const email=document.getElementById("email").value.trim();
    if(!email)return;
    authSubmit.disabled=true; authSubmit.textContent="Sending OTP..."; setMessage("Sending verification code...");
    try{await sendOtp(email);setMessage("OTP sent. Check your email.","#70ff9c");}
    catch(err){setMessage(err.message||"Could not send OTP.","#ff7070");}
    finally{authSubmit.disabled=false;authSubmit.textContent="Send OTP";}
});

verifyOtpButton.addEventListener("click",async()=>{
    const token=otpInput.value.trim();
    if(!pendingEmail||!token){setMessage("Enter the OTP from your email.","#ff7070");return;}
    verifyOtpButton.disabled=true; verifyOtpButton.textContent="Verifying..."; setMessage("Verifying code...");
    try{
        const {data,error}=await supabaseClient.auth.verifyOtp({email:pendingEmail,token,type:"email"});
        if(error)throw error;
        setMessage("Verified successfully!","#70ff9c"); updateAccountUI(data.user);
        setTimeout(()=>authOverlay.classList.remove("active"),600);
    }catch(err){setMessage(err.message||"Invalid or expired OTP.","#ff7070");}
    finally{verifyOtpButton.disabled=false;verifyOtpButton.textContent="Verify & Continue";}
});

otpInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();verifyOtpButton.click();}});
resendOtpButton.addEventListener("click",async()=>{
    if(!pendingEmail)return; resendOtpButton.disabled=true; setMessage("Sending a new OTP...");
    try{await sendOtp(pendingEmail);setMessage("New OTP sent.","#70ff9c");}
    catch(err){setMessage(err.message||"Could not resend OTP.","#ff7070");resendOtpButton.disabled=false;}
});
changeEmailButton.addEventListener("click",()=>{
    clearInterval(resendTimer); pendingEmail=""; otpStage.style.display="none"; emailStage.style.display="block"; setMessage("");
});

function updateAccountUI(user){
    if(user){loginButtonText.textContent="My Account";authArea.style.display="none";accountArea.style.display="block";accountEmail.textContent=user.email;}
    else{loginButtonText.textContent="Login / Sign Up";authArea.style.display="block";accountArea.style.display="none";accountEmail.textContent="";emailStage.style.display="block";otpStage.style.display="none";}
}
async function checkLogin(){const {data:{session}}=await supabaseClient.auth.getSession();updateAccountUI(session?session.user:null);}
checkLogin();
supabaseClient.auth.onAuthStateChange((event,session)=>updateAccountUI(session?session.user:null));
logoutButton.addEventListener("click",async()=>{
    const {error}=await supabaseClient.auth.signOut(); if(error){alert(error.message);return;} updateAccountUI(null);authOverlay.classList.remove("active");
});

const particleContainer =
document.getElementById("particles");

function createParticle(){

    const p =
    document.createElement("span");

    const size =
    Math.random()*6+2;

    p.style.position =
        "absolute";

    p.style.width =
        size+"px";

    p.style.height =
        size+"px";

    p.style.borderRadius =
        "50%";

    p.style.background =
        "#ffffff";

    p.style.opacity =
        Math.random()*0.6;

    p.style.left =
        Math.random()*100+"vw";

    p.style.top =
        "110vh";

    p.style.boxShadow =
        "0 0 20px rgba(255,255,255,.6)";

    particleContainer.appendChild(
        p
    );

    const speed =
    Math.random()*5+6;

    let y =
        110;

    const move =
    setInterval(()=>{

        y -= 0.2;

        p.style.top =
            y+"vh";

        if(y < -10){

            clearInterval(move);

            p.remove();

        }

    },speed);

}

setInterval(
    createParticle,
    120
);

</script>

</body>
</html>

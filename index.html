<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

@font-face{
    font-family:'Sunrise Brown';
    src:url('Sunrise Brown.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    width:100%;
    height:100vh;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity 1s ease-out;
}

#loadingScreen.fade-out{
    opacity:0;
    pointer-events:none;
}

.loader-logo{
    font-size:clamp(32px,5vw,48px);
    font-weight:800;
    letter-spacing:10px;
    color:#00cfff;
    animation:pulse 1.2s infinite;
    text-shadow:0 0 12px #00cfff;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{
        transform:scale(1.1);
        text-shadow:0 0 20px #00cfff,0 0 50px #00cfff;
    }
    100%{transform:scale(1);}
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(8px);
    background:rgba(10,10,10,.18);
    border-bottom:1px solid rgba(255,255,255,.22);
}

nav{
    max-width:1680px;
    height:100%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
    width:100%;
    position:relative;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
}

.login-btn{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:10px 22px;
    background:#fff;
    border:none;
    border-radius:40px;
    color:#000;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.35s;
}

.login-btn:hover{
    transform:translate(-50%,-55%);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

.nav-buttons{
    display:flex;
    gap:12px;
    align-items:center;
}

.about-btn{
    padding:10px 22px;
    background:#fff;
    border-radius:40px;
    color:#000;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    transition:.35s;
}

.about-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

.page{
    position:relative;
    z-index:2;
    flex:1;
    padding-top:64px;
    padding-bottom:80px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.welcome-container{
    text-align:center;
}

.welcome-container h1{
    font-size:clamp(42px,6vw,72px);
    font-weight:800;
    margin-bottom:24px;
    color:#fff;
}

.welcome-container p{
    font-size:clamp(16px,2vw,20px);
    opacity:.65;
    margin-bottom:48px;
}

.action-buttons{
    display:flex;
    gap:20px;
    justify-content:center;
}

.action-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:24px 60px;
    min-width:330px;
    border-radius:24px;
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.2);
    color:#f5f5f5;
    text-decoration:none;
    font-weight:600;
    font-size:24px;
    transition:.35s;
}

.action-btn:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.1);
}

.auth-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.auth-overlay.active{
    opacity:1;
    visibility:visible;
}

.auth-box{
    position:relative;
    width:min(410px,90%);
    padding:32px;
    border-radius:24px;
    background:#111;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 30px 80px rgba(0,0,0,.8);
}

.close-auth{
    position:absolute;
    top:15px;
    right:15px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
}

.auth-title{
    text-align:center;
    font-size:30px;
    color:#00cfff;
    margin-bottom:5px;
}

.auth-subtitle{
    text-align:center;
    font-family:'Poppins',sans-serif;
    font-size:13px;
    opacity:.55;
    margin-bottom:25px;
}

.auth-tabs{
    display:flex;
    background:rgba(255,255,255,.05);
    padding:5px;
    border-radius:14px;
    margin-bottom:24px;
}

.auth-tab{
    flex:1;
    padding:11px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:#aaa;
    font-weight:600;
    cursor:pointer;
}

.auth-tab.active{
    background:#fff;
    color:#000;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    font-family:'Poppins',sans-serif;
    font-size:13px;
    opacity:.7;
}

.input-wrapper{
    position:relative;
}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
}

.input-wrapper input{
    width:100%;
    padding:14px 45px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:white;
    outline:none;
}

.password-eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#888;
}

.auth-options{
    display:flex;
    justify-content:flex-end;
    margin-bottom:18px;
}

.forgot-password{
    color:#00cfff;
    text-decoration:none;
    font-size:12px;
}

.auth-submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#fff;
    color:#000;
    font-weight:700;
    cursor:pointer;
}

.auth-message{
    margin-top:15px;
    text-align:center;
    font-family:'Poppins',sans-serif;
    font-size:13px;
    min-height:20px;
}

#confirmPasswordGroup{
    display:none;
}

.account-box{
    display:none;
    text-align:center;
}

.account-email{
    font-family:'Poppins',sans-serif;
    margin-bottom:20px;
    font-size:14px;
    color:#ccc;
    word-break:break-all;
}

.logout-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#fff;
    color:#000;
    font-weight:700;
    cursor:pointer;
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    text-align:center;
    padding:20px;
    color:#999;
    font-size:14px;
    z-index:100;
    line-height:1.6;
    border-top:1px solid rgba(255,255,255,.22);
    background:rgba(10,10,10,.18);
    backdrop-filter:blur(8px);
}

@media(max-width:900px){

    .action-buttons{
        flex-direction:column;
    }

    .action-btn{
        min-width:100%;
        max-width:420px;
    }
}

@media(max-width:600px){

    .login-btn{
        position:static;
        transform:none;
        margin-left:auto;
        margin-right:8px;
        font-size:11px;
        padding:7px 11px;
    }

    .login-btn:hover{
        transform:translateY(-2px);
    }

    .logo{
        font-size:16px;
    }

    .about-btn{
        font-size:11px;
        padding:7px 10px;
    }
}

</style>
</head>

<body>

<div id="loadingScreen">
    <div class="loader-logo">XENARO</div>
</div>

<div id="particles"></div>

<header>
<nav>

    <div class="logo">
        XENARO
    </div>

    <button class="login-btn" id="openAuth">
        <i class="fa-solid fa-user"></i>
        <span id="loginButtonText">Login / Sign Up</span>
    </button>

    <div class="nav-buttons">
        <a class="about-btn" href="about/">
            About Me
        </a>
    </div>

</nav>
</header>

<main class="page">

<div class="welcome-container">

    <h1>
        WELCOME TO MY
        <span style="color:#00cfff;">
            WEBSITE
        </span>
    </h1>

    <p>
        Explore my gaming and content creation world
    </p>

    <div class="action-buttons">

        <a href="gaming/" class="action-btn">
            <i class="fa-brands fa-youtube"></i>
            Gaming Channel
        </a>

        <a href="editing/" class="action-btn">
            <i class="fa-solid fa-film"></i>
            Editing Content
        </a>

    </div>

</div>

</main>


<!-- AUTH POPUP -->

<div class="auth-overlay" id="authOverlay">

<div class="auth-box">

    <button class="close-auth" id="closeAuth">
        <i class="fa-solid fa-xmark"></i>
    </button>

    <h2 class="auth-title">
        XENARO
    </h2>


    <!-- LOGIN / SIGNUP AREA -->

    <div id="authArea">

        <p class="auth-subtitle" id="authSubtitle">
            Welcome back! Login to your account.
        </p>

        <div class="auth-tabs">

            <button
            type="button"
            class="auth-tab active"
            id="loginTab">
                Login
            </button>

            <button
            type="button"
            class="auth-tab"
            id="signupTab">
                Sign Up
            </button>

        </div>


        <form id="authForm">

            <div class="input-group">

                <label>Email Address</label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope input-icon"></i>

                    <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

                </div>

            </div>


            <div class="input-group">

                <label>Password</label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock input-icon"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

                    <span
                    class="password-eye"
                    onclick="togglePassword('password',this)">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

            </div>


            <div
            class="input-group"
            id="confirmPasswordGroup">

                <label>
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock input-icon"></i>

                    <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password">

                    <span
                    class="password-eye"
                    onclick="togglePassword('confirmPassword',this)">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                </div>

            </div>


            <div
            class="auth-options"
            id="forgotContainer">

                <a
                href="#"
                class="forgot-password"
                id="forgotPassword">

                    Forgot Password?

                </a>

            </div>


            <button
            type="submit"
            class="auth-submit"
            id="authSubmit">

                Login

            </button>


            <div
            class="auth-message"
            id="authMessage">
            </div>

        </form>

    </div>


    <!-- LOGGED IN ACCOUNT AREA -->

    <div
    class="account-box"
    id="accountArea">

        <p class="auth-subtitle">
            You are logged in as
        </p>

        <div
        class="account-email"
        id="accountEmail">
        </div>

        <button
        class="logout-btn"
        id="logoutButton">

            Logout

        </button>

    </div>

</div>

</div>


<footer>

    <div>XENARO</div>

    <div>
        © 2026 All Rights Reserved
    </div>

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://bvmcuoiprayzeksljnyo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RlXQ4_mUAhiKxuTsxGLU-Q_ILaQT_8C";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   LOADER
========================= */

window.addEventListener("load",()=>{

    setTimeout(()=>{

        const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );

        if(loadingScreen){

            loadingScreen.classList.add(
                "fade-out"
            );

            setTimeout(()=>{

                loadingScreen.remove();

            },1000);

        }

    },1200);

});


/* =========================
   AUTH VARIABLES
========================= */

const openAuth =
document.getElementById(
    "openAuth"
);

const closeAuth =
document.getElementById(
    "closeAuth"
);

const authOverlay =
document.getElementById(
    "authOverlay"
);

const loginTab =
document.getElementById(
    "loginTab"
);

const signupTab =
document.getElementById(
    "signupTab"
);

const authForm =
document.getElementById(
    "authForm"
);

const authSubmit =
document.getElementById(
    "authSubmit"
);

const authMessage =
document.getElementById(
    "authMessage"
);

const confirmPasswordGroup =
document.getElementById(
    "confirmPasswordGroup"
);

const confirmPassword =
document.getElementById(
    "confirmPassword"
);

const forgotContainer =
document.getElementById(
    "forgotContainer"
);

const authSubtitle =
document.getElementById(
    "authSubtitle"
);

const loginButtonText =
document.getElementById(
    "loginButtonText"
);

const authArea =
document.getElementById(
    "authArea"
);

const accountArea =
document.getElementById(
    "accountArea"
);

const accountEmail =
document.getElementById(
    "accountEmail"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);


/* =========================
   OPEN / CLOSE POPUP
========================= */

openAuth.addEventListener(
"click",
()=>{

    authOverlay.classList.add(
        "active"
    );

});


closeAuth.addEventListener(
"click",
()=>{

    authOverlay.classList.remove(
        "active"
    );

});


authOverlay.addEventListener(
"click",
(event)=>{

    if(event.target === authOverlay){

        authOverlay.classList.remove(
            "active"
        );

    }

});


document.addEventListener(
"keydown",
(event)=>{

    if(event.key === "Escape"){

        authOverlay.classList.remove(
            "active"
        );

    }

});


/* =========================
   LOGIN TAB
========================= */

loginTab.addEventListener(
"click",
()=>{

    loginTab.classList.add(
        "active"
    );

    signupTab.classList.remove(
        "active"
    );

    confirmPasswordGroup.style.display =
        "none";

    confirmPassword.required =
        false;

    forgotContainer.style.display =
        "flex";

    authSubmit.textContent =
        "Login";

    authSubtitle.textContent =
        "Welcome back! Login to your account.";

    authMessage.textContent =
        "";

});


/* =========================
   SIGNUP TAB
========================= */

signupTab.addEventListener(
"click",
()=>{

    signupTab.classList.add(
        "active"
    );

    loginTab.classList.remove(
        "active"
    );

    confirmPasswordGroup.style.display =
        "block";

    confirmPassword.required =
        true;

    forgotContainer.style.display =
        "none";

    authSubmit.textContent =
        "Create Account";

    authSubtitle.textContent =
        "Create your Xenaro account.";

    authMessage.textContent =
        "";

});


/* =========================
   SHOW PASSWORD
========================= */

function togglePassword(
    inputId,
    element
){

    const input =
    document.getElementById(
        inputId
    );

    const icon =
    element.querySelector(
        "i"
    );


    if(input.type === "password"){

        input.type =
            "text";

        icon.classList.remove(
            "fa-eye"
        );

        icon.classList.add(
            "fa-eye-slash"
        );

    }

    else{

        input.type =
            "password";

        icon.classList.remove(
            "fa-eye-slash"
        );

        icon.classList.add(
            "fa-eye"
        );

    }

}


/* =========================
   SIGNUP + LOGIN
========================= */

authForm.addEventListener(
"submit",
async(event)=>{

    event.preventDefault();


    authMessage.textContent =
        "";


    const email =
    document.getElementById(
        "email"
    ).value.trim();


    const password =
    document.getElementById(
        "password"
    ).value;


    const isSignup =
    signupTab.classList.contains(
        "active"
    );


    authSubmit.disabled =
        true;


    if(isSignup){

        authSubmit.textContent =
            "Creating Account...";

    }

    else{

        authSubmit.textContent =
            "Logging In...";

    }


    try{


        /* =====================
           SIGN UP
        ===================== */

        if(isSignup){

            const confirm =
            confirmPassword.value;


            if(password.length < 6){

                authMessage.style.color =
                    "#ff7070";

                authMessage.textContent =
                    "Password must be at least 6 characters.";

                return;

            }


            if(password !== confirm){

                authMessage.style.color =
                    "#ff7070";

                authMessage.textContent =
                    "Passwords do not match.";

                return;

            }


            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email:email,

                password:password

            });


            if(error){

                authMessage.style.color =
                    "#ff7070";

                authMessage.textContent =
                    error.message;

                return;

            }


            authMessage.style.color =
                "#70ff9c";


            if(
                data.user &&
                !data.session
            ){

                authMessage.textContent =
                "Account created! Check your email to verify your account.";

            }

            else{

                authMessage.textContent =
                    "Account created successfully.";

            }


            document.getElementById(
                "password"
            ).value =
                "";

            confirmPassword.value =
                "";

        }


        /* =====================
           LOGIN
        ===================== */

        else{

            const {
                data,
                error
            } =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                authMessage.style.color =
                    "#ff7070";

                authMessage.textContent =
                    error.message;

                return;

            }


            authMessage.style.color =
                "#70ff9c";

            authMessage.textContent =
                "Logged in successfully!";


            updateAccountUI(
                data.user
            );


            setTimeout(()=>{

                authOverlay.classList.remove(
                    "active"
                );

            },600);

        }

    }

    catch(error){

        console.error(
            error
        );

        authMessage.style.color =
            "#ff7070";

        authMessage.textContent =
            "Something went wrong.";

    }

    finally{

        authSubmit.disabled =
            false;


        if(
        signupTab.classList.contains(
            "active"
        )
        ){

            authSubmit.textContent =
                "Create Account";

        }

        else{

            authSubmit.textContent =
                "Login";

        }

    }

});


/* =========================
   FORGOT PASSWORD
========================= */

document.getElementById(
    "forgotPassword"
)
.addEventListener(
"click",
async(event)=>{

    event.preventDefault();


    const email =
    document.getElementById(
        "email"
    ).value.trim();


    if(!email){

        authMessage.style.color =
            "#ff7070";

        authMessage.textContent =
            "Enter your email address first.";

        return;

    }


    authMessage.style.color =
        "#aaa";

    authMessage.textContent =
        "Sending password reset email...";


    const {
        error
    } =
    await supabaseClient.auth
    .resetPasswordForEmail(

        email,

        {

            redirectTo:
            window.location.origin +
            "/reset-password/"

        }

    );


    if(error){

        authMessage.style.color =
            "#ff7070";

        authMessage.textContent =
            error.message;

        return;

    }


    authMessage.style.color =
        "#70ff9c";

    authMessage.textContent =
        "Password reset email sent!";

});


/* =========================
   UPDATE ACCOUNT UI
========================= */

function updateAccountUI(user){

    if(user){

        loginButtonText.textContent =
            "My Account";

        authArea.style.display =
            "none";

        accountArea.style.display =
            "block";

        accountEmail.textContent =
            user.email;

    }

    else{

        loginButtonText.textContent =
            "Login / Sign Up";

        authArea.style.display =
            "block";

        accountArea.style.display =
            "none";

        accountEmail.textContent =
            "";

    }

}


/* =========================
   CHECK LOGIN ON PAGE LOAD
========================= */

async function checkLogin(){

    const {
        data:{
            session
        }
    } =
    await supabaseClient.auth
    .getSession();


    if(session){

        updateAccountUI(
            session.user
        );

    }

    else{

        updateAccountUI(
            null
        );

    }

}


checkLogin();


/* =========================
   AUTH STATE CHANGE
========================= */

supabaseClient.auth
.onAuthStateChange(
(event,session)=>{

    if(session){

        updateAccountUI(
            session.user
        );

    }

    else{

        updateAccountUI(
            null
        );

    }

});


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
"click",
async()=>{

    const {
        error
    } =
    await supabaseClient.auth
    .signOut();


    if(error){

        alert(
            error.message
        );

        return;

    }


    updateAccountUI(
        null
    );


    authOverlay.classList.remove(
        "active"
    );

});


/* =========================
   PARTICLES
========================= */

const particleContainer =
document.getElementById(
    "particles"
);


function createParticle(){

    const p =
    document.createElement(
        "span"
    );


    const size =
    Math.random()*6+2;


    p.style.position =
        "absolute";

    p.style.width =
        size+"px";

    p.style.height =
        size+"px";

    p.style.borderRadius =
        "50%";

    p.style.background =
        "#ffffff";

    p.style.opacity =
        Math.random()*0.6;

    p.style.left =
        Math.random()*100+"vw";

    p.style.top =
        "110vh";

    p.style.boxShadow =
        "0 0 20px rgba(255,255,255,.6)";


    particleContainer.appendChild(
        p
    );


    const speed =
    Math.random()*5+6;


    let y =
        110;


    const move =
    setInterval(()=>{

        y -= 0.2;

        p.style.top =
            y+"vh";


        if(y < -10){

            clearInterval(
                move
            );

            p.remove();

        }

    },speed);

}


setInterval(
    createParticle,
    120
);

</script>

<style>
@font-face{
    font-family:'Sunrise Brown';
    src:url('Sunrise Brown.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100%;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    background:#000;
    color:#f5f5f5;
    overflow-x:hidden;
    overflow-y:auto;
}

::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:#000; }
::-webkit-scrollbar-thumb{
    background:#fff;
    border-radius:100px;
}

/* Background particles (white dots drifting upwards) */
#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

/* Each dot is moved by a CSS transform only, so the browser animates it without main-thread work */
.particle{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 0 10px rgba(255,255,255,.6);
    will-change:transform;
    animation-name:particleDrift;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

@keyframes particleDrift{
    from{ transform:translateY(0); }
    to{ transform:translateY(-115vh); }
}

/* Loading screen: cyan XENARO */
#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    visibility:visible;
    transition:opacity .45s ease, visibility .45s ease;
}

#loadingScreen.fade-out{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:34px;
}

/* Spinning cyan orbit behind the logo */
.loader::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:min(70vw,260px);
    height:min(70vw,260px);
    margin:calc(min(70vw,260px) / -2) 0 0 calc(min(70vw,260px) / -2);
    border-radius:50%;
    border:2px solid rgba(0,207,255,.12);
    border-top-color:#00cfff;
    box-shadow:0 0 18px rgba(0,207,255,.35);
    animation:orbitSpin 1.2s linear infinite;
}

.loader-logo{
    position:relative;
    z-index:1;
    font-size:clamp(36px,8vw,64px);
    font-weight:800;
    letter-spacing:4px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
    animation:logoPulse 1.4s ease-in-out infinite;
}

/* Each letter rises out of a blur, one after another */
.loader-logo span{
    display:inline-block;
    opacity:0;
    filter:blur(10px);
    transform:translateY(24px) scale(.8);
    animation:letterIn .6s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:calc(var(--i) * .11s);
}

/* Thin progress line under the logo */
.loader-bar{
    position:relative;
    z-index:1;
    width:min(60vw,200px);
    height:2px;
    background:rgba(0,207,255,.15);
    overflow:hidden;
    border-radius:2px;
}

.loader-bar i{
    display:block;
    height:100%;
    width:100%;
    background:#00cfff;
    box-shadow:0 0 10px #00cfff;
    transform:scaleX(0);
    transform-origin:left center;
    animation:barFill 1.7s ease-in-out forwards;
}

@keyframes orbitSpin{
    to{ transform:rotate(360deg); }
}

@keyframes letterIn{
    to{ opacity:1; filter:blur(0); transform:translateY(0) scale(1); }
}

@keyframes barFill{
    to{ transform:scaleX(1); }
}

@keyframes logoPulse{
    0%,100%{ text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6); }
    50%{ text-shadow:0 0 20px #00cfff,0 0 50px rgba(0,207,255,.8); }
}

/* Header */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(8px);
    background:rgba(0,0,0,.6);
    border-bottom:1px solid rgba(255,255,255,.22);
}

nav{
    max-width:1680px;
    height:100%;
    margin:auto;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
    position:relative;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
    animation:logoPulse 2s ease-in-out infinite;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.nav-buttons{
    display:flex;
    gap:12px;
    align-items:center;
}

.about-btn,
.join-btn{
    padding:10px 22px;
    background:#fff;
    border-radius:40px;
    color:#000;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    transition:.35s;
}

.about-btn:hover,
.join-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

/* Page */
.page{
    position:relative;
    z-index:2;
    padding-top:64px;
}

/* Hero */
.hero-section{
    width:100%;
    max-width:1320px;
    min-height:auto;
    margin:0 auto;
    padding:42px clamp(24px,4vw,64px) 52px;
    display:grid;
    grid-template-columns:1fr;
    gap:30px;
    align-items:center;
}

.hero-left{
    text-align:center;
}

.hero-left h2{
    font-size:clamp(26px,3.4vw,48px);
    line-height:1.02;
    font-weight:800;
    margin-bottom:16px;
}

.hero-left p{
    font-size:clamp(13px,1.2vw,17px);
    opacity:.7;
}

.hero-right{
    width:min(100%,880px);
    margin:0 auto;
    perspective:1200px;
    position:relative;
    z-index:10;
}

/* Profile card: near-black, no outline by default */
.glass-card{
    position:relative;
    width:100%;
    background:#0d0d0d;
    border-radius:18px;
    border:1px solid #fff;
    padding:clamp(20px,2.4vw,30px);
    transition:transform .22s ease-out, translate .35s ease, scale .35s ease, border-color .3s ease, box-shadow .3s ease;
    transform-style:flat;
    will-change:transform;
}

/* Rainbow outline: a wrapper clips a large conic-gradient square that spins clockwise,
   one full turn per second. The spin is a transform, so it stays on the compositor.
   Shown only on hover (profile card and social buttons) */
.rainbow{
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:2px;
    overflow:hidden;
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

.rainbow-spin{
    position:absolute;
    left:50%;
    top:50%;
    width:150%;
    aspect-ratio:1;
    translate:-50% -50%;
    background:conic-gradient(#ff0040,#ff9900,#ffee00,#33ff66,#00cfff,#3366ff,#cc33ff,#ff0040);
    will-change:transform;
    animation:rainbowSpin 1s linear infinite;
}

.glass-card:hover .rainbow,
.social-link:hover .rainbow{
    opacity:1;
}

/* Hovered profile card pops out toward the viewer */
.glass-card:hover{
    translate:0 -12px;
    scale:1.04;
    border-color:transparent;
    box-shadow:
        0 0 14px rgba(255,0,110,.55),
        0 0 28px rgba(0,207,255,.45),
        0 0 48px rgba(170,80,255,.35),
        0 24px 50px rgba(0,0,0,.6);
}

@keyframes rainbowSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

.card-layer{ transform-style:flat; }

.glass-card h2{
    font-size:clamp(20px,2.4vw,30px);
    margin-bottom:5px;
    overflow-wrap:anywhere;
}

.glass-card > .card-layer > p{
    font-size:16px;
    opacity:.65;
    overflow-wrap:anywhere;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:22px 18px;
    margin-top:24px;
}

.stats h3{
    font-size:clamp(18px,2vw,26px);
    color:#fff;
}

.stats span{
    display:block;
    margin-top:4px;
    opacity:.6;
    font-size:15px;
    line-height:1.4;
    overflow-wrap:anywhere;
    hyphens:auto;
}

.stats > div{
    min-width:0;
}

/* Scrolling content area */
.content-flow{
    width:min(960px,calc(100% - 80px));
    margin:0 auto;
    padding:20px 0 90px;
}

/* Social links: near-black, rainbow outline on hover */
.social-section{
    padding-top:12px;
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    align-items:center;
}

.social-link{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 18px;
    border-radius:50px;
    background:#0d0d0d;
    border:1px solid #fff;
    color:#f5f5f5;
    font-size:22px;
    text-decoration:none;
    transition:translate .45s cubic-bezier(.2,.8,.2,1), scale .35s ease, box-shadow .35s, border-color .35s;
}

.social-link span{
    font-size:17px;
    font-weight:500;
}

.social-link::after{
    content:attr(data-label);
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:#fff;
    padding:6px 12px;
    border:1px solid #fff;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    margin-bottom:8px;
}

/* Hovered social button pops out; siblings are pushed away by JS */
.social-link:hover{
    translate:0 -6px;
    scale:1.12;
    border-color:transparent;
    box-shadow:
        0 0 14px rgba(255,0,110,.55),
        0 0 28px rgba(0,207,255,.45),
        0 0 48px rgba(170,80,255,.35);
}

.social-link:hover::after{ opacity:1; }

footer{
    position:relative;
    z-index:2;
    padding:24px 20px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.12);
    color:#999;
    font-size:14px;
    background:#000;
}

footer h2{
    font-size:18px;
    margin-bottom:4px;
    color:#f5f5f5;
}

@media(max-width:900px){
    header{ height:56px; }
    nav{ padding:0 18px; }
    .logo{ font-size:19px; }
    .nav-buttons{ gap:8px; }
    .about-btn,.join-btn{ padding:8px 14px; font-size:13px; }

    .hero-left h2{

    .hero-right{

    }

    .glass-card{
        padding:26px 22px;

    }

    .glass-card h2,

        transform:none;
    }

    .content-flow{
        width:min(100% - 32px,700px);
        padding:10px 0 64px;
    }

    .social-links{ gap:10px; }
    .social-link{
        flex:0 1 calc(50% - 5px);
        max-width:220px;
        justify-content:center;
        padding:11px 14px;
        font-size:18px;
    }
    .social-link span{ font-size:16px; }
}

@media(max-width:520px){
    .stats{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:18px 10px;
        padding-top:20px;
        border-top:1px solid rgba(255,255,255,.1);
    }

    .stats h3{ font-size:clamp(18px,2vw,26px); }
    .stats span{ font-size:13px; }
}

@media(max-width:900px){
    .hero-left h2{font-size:clamp(27px,8vw,38px);}
    .hero-left p{font-size:16px;}
    .glass-card h2{font-size:21px;}
    .stats h3{font-size:18px;}
}

/* Loading spinner */
.simple-loader {
    width: 52px;
    height: 52px;
    border: 4px solid rgba(255, 255, 255, .18);
    border-top-color: #fff;
    border-radius: 50%;
    animation: simpleLoaderSpin .75s linear infinite;
}

@keyframes simpleLoaderSpin {
    to {
        transform: rotate(360deg);
    }
}

/* Cursor glow: a faint translucent circle that follows the mouse (created by JS on fine pointers only) */
#cursorGlow{
    position:fixed;
    left:0;
    top:0;
    width:60px;
    height:60px;
    margin:-30px 0 0 -30px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,.12) 55%, rgba(255,255,255,0) 72%);
    border:1px solid rgba(255,255,255,.22);
    pointer-events:none;
    z-index:8990;
    opacity:0;
    transition:opacity .3s ease;
    will-change:transform;
}

/* Drag trail canvas: rainbow glowing line drawn while dragging on empty space */
#trailCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:8989;
}

body.drawing{
    user-select:none;
    -webkit-user-select:none;
}

/* White click/touch circle fade effect */
.click-circle{
    position:fixed;
    width:18px;
    height:18px;
    left:0;
    top:0;
    border:2px solid #fff;
    border-radius:50%;
    pointer-events:none;
    z-index:99998;
    transform:translate(-50%,-50%) scale(.2);
    opacity:.95;
    box-shadow:0 0 8px rgba(255,255,255,.65);
    animation:clickCircleFade .6s ease-out forwards;
}
@keyframes clickCircleFade{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:.95;}
    100%{transform:translate(-50%,-50%) scale(3.2);opacity:0;}
}

</style>

<script>
/* Create a fading white circle wherever the user clicks or touches */
function createClickCircle(x,y){
    const circle=document.createElement("span");
    circle.className="click-circle";
    circle.style.left=x+"px";
    circle.style.top=y+"px";
    document.body.appendChild(circle);
    circle.addEventListener("animationend",()=>circle.remove());
}
document.addEventListener("pointerdown",(e)=>{
    createClickCircle(e.clientX,e.clientY);
});

window.addEventListener('load', () => {
    setTimeout(() => {
        const loadingScreen = document.getElementById('loadingScreen');

        if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(() => loadingScreen.remove(), 600);
        }
    }, 900);
});

/* White dots drifting upwards in the background.
   A fixed pool is created once; CSS keyframes move them, so there are no timers or per-frame DOM writes. */
const PARTICLE_COUNT = 40;
const particleContainer = document.getElementById("particles");
for(let i = 0; i < PARTICLE_COUNT; i++){
    const p = document.createElement("span");
    const size = Math.random() * 6 + 2;
    const duration = Math.random() * 3 + 5; // seconds for one crossing
    p.className = "particle";
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = Math.random() * 100 + "vw";
    p.style.opacity = Math.random() * 0.6;
    p.style.animationDuration = duration + "s";
    p.style.animationDelay = -(Math.random() * duration) + "s"; // negative delay spreads dots across the screen at start
    particleContainer.appendChild(p);
}

/* Add the spinning rainbow ring to the profile card and each social button */
document.querySelectorAll(".glass-card, .social-link").forEach(el => {
    const ring = document.createElement("span");
    ring.className = "rainbow";
    ring.setAttribute("aria-hidden", "true");
    ring.innerHTML = '<span class="rainbow-spin"></span>';
    el.prepend(ring);
});

/* Cursor glow: a translucent circle that trails the pointer smoothly (mouse/trackpad only) */
if(window.matchMedia('(pointer:fine)').matches){
    const cursorGlow = document.createElement('div');
    cursorGlow.id = 'cursorGlow';
    document.body.appendChild(cursorGlow);

    let targetX = -999, targetY = -999, glowX = -999, glowY = -999;

    window.addEventListener('pointermove', e => {
        targetX = e.clientX;
        targetY = e.clientY;
        cursorGlow.style.opacity = '1';
    });

    window.addEventListener('mouseout', e => {
        if(!e.relatedTarget) cursorGlow.style.opacity = '0';
    });

    (function followCursor(){
        glowX += (targetX - glowX) * 0.18;
        glowY += (targetY - glowY) * 0.18;
        cursorGlow.style.transform = `translate3d(${glowX}px, ${glowY}px, 0)`;
        requestAnimationFrame(followCursor);
    })();
}

/* Drag trail: holding the mouse on empty space and dragging draws a temporary glowing rainbow line */
const trailCanvas = document.createElement('canvas');
trailCanvas.id = 'trailCanvas';
document.body.appendChild(trailCanvas);
const trailCtx = trailCanvas.getContext('2d');

function resizeTrail(){
    trailCanvas.width = innerWidth;
    trailCanvas.height = innerHeight;
}
resizeTrail();
window.addEventListener('resize', resizeTrail);

const TRAIL_LIFE = 380; // ms a point stays visible before the line fades away
let trailStrokes = [];   // each press-and-drag is its own separate line
let currentStroke = null;
let pressPoint = null;
let isDragging = false;

// Dragging that starts on links, buttons or the profile/social cards does not draw
const isInteractive = el => el.closest('a, button, input, textarea, header, .glass-card, .social-link');

document.addEventListener('pointerdown', e => {
    if(e.button !== 0 || isInteractive(e.target)) return;
    isDragging = true;
    currentStroke = null; // a new line starts only once the pointer actually moves
    pressPoint = { x: e.clientX, y: e.clientY };
    document.body.classList.add('drawing');
});

window.addEventListener('pointermove', e => {
    if(!isDragging) return;
    const point = { x: e.clientX, y: e.clientY, t: performance.now() };
    if(!currentStroke){
        // The first movement starts the line from where the press began
        currentStroke = [{ x: pressPoint.x, y: pressPoint.y, t: point.t }, point];
        trailStrokes.push(currentStroke);
        return;
    }
    const last = currentStroke[currentStroke.length - 1];
    // Skip tiny movements so the curve stays clean
    if(Math.hypot(point.x - last.x, point.y - last.y) < 2) return;
    currentStroke.push(point);
});

function stopDragging(){
    isDragging = false;
    currentStroke = null;
    document.body.classList.remove('drawing');
}
window.addEventListener('pointerup', stopDragging);
window.addEventListener('pointercancel', stopDragging);
window.addEventListener('blur', stopDragging);

(function drawTrail(){
    const now = performance.now();
    trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

    // Age out old points in place so the line being drawn stays linked to its pointer
    trailStrokes.forEach(s => { while(s.length && now - s[0].t >= TRAIL_LIFE) s.shift(); });
    trailStrokes = trailStrokes.filter(s => s.length > 0 || s === currentStroke);
    trailStrokes.forEach(pts => drawStroke(pts, now));

    requestAnimationFrame(drawTrail);
})();

function drawStroke(pts, now){
    const n = pts.length;
    if(n >= 2){
        trailCtx.lineCap = 'round';
        trailCtx.lineJoin = 'round';
        trailCtx.globalAlpha = 1;

        // Midpoint between two points: the curve passes through midpoints and uses each point as a control
        const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        const shift = (now * 0.12) % 360; // slow colour flow

        for(let i = 1; i < n; i++){
            const age = (now - pts[i].t) / TRAIL_LIFE;
            const width = 4 * (1 - age); // the line thins out as it fades
            if(width <= 0.3) continue;

            const start = i === 1 ? pts[0] : mid(pts[i - 1], pts[i]);
            const end = i === n - 1 ? pts[i] : mid(pts[i], pts[i + 1]);
            const hue = ((i / n) * 240 + shift) % 360; // rainbow runs along the line

            // Opaque colour, so overlapping pieces stay smooth; the glow comes from a soft shadow
            const color = `hsl(${hue}, 100%, 60%)`;
            trailCtx.strokeStyle = color;
            trailCtx.shadowColor = color;
            trailCtx.shadowBlur = 22;
            trailCtx.lineWidth = width;
            trailCtx.beginPath();
            trailCtx.moveTo(start.x, start.y);
            trailCtx.quadraticCurveTo(pts[i].x, pts[i].y, end.x, end.y);
            trailCtx.stroke();
        }
        trailCtx.shadowBlur = 0;
    }
}

const header = document.querySelector("header");
window.addEventListener("scroll", () => {
    header.style.background = window.scrollY > 50 ? "rgba(0,0,0,.85)" : "rgba(0,0,0,.6)";
});

/* Profile card: tilt follows the mouse (pop-out is handled in CSS via the translate/scale properties) */
document.querySelectorAll(".glass-card").forEach(card => {
    card.addEventListener("mousemove", e => {
        if(window.innerWidth <= 900) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rx = ((y / rect.height) - 0.5) * 10;
        const ry = (0.5 - (x / rect.width)) * 10;
        card.style.transform = `perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1200px) rotateX(0deg) rotateY(0deg)";
    });
});

/* Social buttons: hovered one pops out, the others slide away from it */
const socialLinks = document.querySelectorAll(".social-link");
const PUSH_DISTANCE = 26; // px each neighbour moves away from the hovered button

function pushSiblingsAway(hovered){
    const hc = hovered.getBoundingClientRect();
    const cx = hc.left + hc.width / 2;
    const cy = hc.top + hc.height / 2;

    socialLinks.forEach(other => {
        if(other === hovered) return;
        const oc = other.getBoundingClientRect();
        const dx = (oc.left + oc.width / 2) - cx;
        const dy = (oc.top + oc.height / 2) - cy;
        const dist = Math.hypot(dx, dy) || 1;
        other.style.translate = `${(dx / dist) * PUSH_DISTANCE}px ${(dy / dist) * PUSH_DISTANCE}px`;
    });
}

function resetSiblings(){
    socialLinks.forEach(other => { other.style.translate = ""; });
}

socialLinks.forEach(link => {
    link.addEventListener("mouseenter", () => pushSiblingsAway(link));
    link.addEventListener("mouseleave", resetSiblings);
});
</script>

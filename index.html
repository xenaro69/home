<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
@font-face{
    font-family:'Sunrise Brown';
    src:url('Sunrise Brown.otf') format('opentype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    width:100%;
    height:100vh;
    font-family:'Sunrise Brown','Poppins',sans-serif;
    background:#0a0a0a;
    color:#f5f5f5;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:#0f0f0f; }
::-webkit-scrollbar-thumb{
    background:#fff;
    border-radius:100px;
}

/* Background particles */
#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

/* Loader */
#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity 1s ease-out;
}

#loadingScreen.fade-out{
    opacity:0;
    pointer-events:none;
}

.loader-logo{
    font-size:clamp(32px,5vw,48px);
    font-weight:800;
    letter-spacing:10px;
    color:#00cfff;
    animation:pulse 1.2s infinite;
    text-shadow:0 0 12px #00cfff;
}

@keyframes pulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.1); text-shadow:0 0 20px #00cfff,0 0 50px #00cfff; }
    100%{ transform:scale(1); }
}

/* Header */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    z-index:500;
    backdrop-filter:blur(8px);
    background:rgba(10,10,10,.18);
    border-bottom:1px solid rgba(255,255,255,.22);
}

nav{
    max-width:1680px;
    height:100%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(24px,4vw,64px);
    width:100%;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    color:#00cfff;
    text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6);
    animation:logoPulse 2s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{ text-shadow:0 0 12px #00cfff,0 0 30px rgba(0,207,255,.6); }
    50%{ text-shadow:0 0 20px #00cfff,0 0 50px rgba(0,207,255,.8); }
}

.nav-buttons{
    display:flex;
    gap:12px;
    align-items:center;
}

.about-btn{
    padding:10px 22px;
    background:#fff;
    border-radius:40px;
    color:#000;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    transition:.35s;
}

.about-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

/* Page */
.page{
    position:relative;
    z-index:2;
    flex:1;
    padding-top:64px;
    padding-bottom:80px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Welcome Section */
.welcome-container{
    text-align:center;
    animation:fadeInUp 1s ease-out;
}

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.welcome-container h1{
    font-size:clamp(42px,6vw,72px);
    font-weight:800;
    margin-bottom:24px;
    color:#fff;
    letter-spacing:1px;
}

.welcome-container p{
    font-size:clamp(16px,2vw,20px);
    opacity:.65;
    margin-bottom:48px;
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
}

.action-buttons{
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:center;
    max-width:900px;
    margin:0 auto;
}

.action-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:24px 60px;
    min-width:330px;
    border-radius:24px;
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.2);
    color:#f5f5f5;
    text-decoration:none;
    font-weight:600;
    font-size:24px;
    backdrop-filter:blur(28px);
    box-shadow:0 18px 45px rgba(0,0,0,.35);
    transition:.35s ease;
    cursor:pointer;
}

.action-btn:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.45);
    box-shadow:0 0 35px rgba(255,255,255,.14),0 24px 55px rgba(0,0,0,.5);
    background:rgba(255,255,255,.1);
}

.action-btn i{
    font-size:20px;
}

@media(max-width:900px){
    header{ height:56px; }
    nav{ padding:0 18px; }
    .logo{ font-size:19px; }
    .about-btn{ padding:8px 14px; font-size:13px; }

    .page{ padding-top:56px; }

    .welcome-container h1{
        font-size:clamp(32px,7vw,54px);
        margin-bottom:16px;
    }

    .welcome-container p{
        font-size:16px;
        margin-bottom:32px;
    }

    .action-buttons{
        gap:12px;
        flex-direction:column;
    }

    .action-btn{
        min-width:100%;
        width:100%;
        max-width:420px;
        padding:20px 50px;
        font-size:20px;
    }
}

@media(max-width:520px){
    .welcome-container h1{
        font-size:clamp(28px,6vw,40px);
        margin-bottom:12px;
    }

    .welcome-container p{
        font-size:14px;
        margin-bottom:24px;
    }

    .action-btn{
        padding:14px 30px;
        min-width:160px;
        font-size:14px;
    }

    .action-btn i{
        font-size:18px;
    }
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    text-align:center;
    padding:20px;
    color:#999;
    font-size:14px;
    z-index:100;
    line-height:1.6;
}
</style>
</head>

<body>
<div id="loadingScreen">
    <div class="loader-logo">XENARO</div>
</div>

<div id="particles"></div>

<header>
    <nav>
        <div class="logo">XENARO</div>
        <div class="nav-buttons">
            <a class="about-btn" href="about/">About Me</a>
        </div>
    </nav>
</header>

<main class="page">
    <div class="welcome-container">
        <h1>WELCOME TO MY <span style="color:#00cfff;">WEBSITE</span></h1>
        <p>Explore my gaming and content creation world</p>
        
        <div class="action-buttons">
            <a href="gaming/" class="action-btn">
                <i class="fa-brands fa-youtube"></i>
                Gaming Channel
            </a>
            <a href="editng/" class="action-btn">
                <i class="fa-solid fa-film"></i>
                Editing Content
            </a>
        </div>
    </div>
</main>

<footer>
    <div>XENARO</div>
    <div>© 2026 All Rights Reserved</div>
</footer>

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        const loadingScreen = document.getElementById("loadingScreen");
        if(loadingScreen){
            loadingScreen.classList.add("fade-out");
            setTimeout(() => loadingScreen.remove(), 1000);
        }
    }, 1200);
});

const header = document.querySelector("header");
window.addEventListener("scroll", () => {
    header.style.background = window.scrollY > 50 ? "rgba(10,10,10,.62)" : "rgba(10,10,10,.18)";
});

const particleContainer = document.getElementById("particles");
function createParticle(){
    const p = document.createElement("span");
    const size = Math.random() * 6 + 2;
    p.style.position = "absolute";
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.borderRadius = "50%";
    p.style.background = "#ffffff";
    p.style.opacity = Math.random() * 0.6;
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = "110vh";
    p.style.boxShadow = "0 0 20px rgba(255,255,255,.6)";
    particleContainer.appendChild(p);

    const speed = Math.random() * 5 + 6;
    let y = 110;
    const move = setInterval(() => {
        y -= 0.2;
        p.style.top = y + "vh";
        if(y < -10){
            clearInterval(move);
            p.remove();
        }
    }, speed);
}
setInterval(createParticle,120);
</script>
</body>
</html>
